 الصارم بما نص عليه العقد المبدئي."},{letter:"ج",text:"إخبار الموظف في الجلسة القادمة بطلب الموارد البشرية وإخباره بأنك مضطر لمشاركتها لأن الشركة هي من دفعت الرسوم.",isCorrect:!1,feedback:"غير صحيح. هذا يدمر الثقة والأمان (الجدارة 4) ويعكس فهماً خاطئاً لطبيعة عقد الكوتشينج وأخلاقيات ICF."},{letter:"د",text:"إرسال التقرير للمدير التنفيذي للشركة بدلاً من مدير الموارد البشرية لضمان وصوله لأعلى سلطة بصورة محايدة.",isCorrect:!1,feedback:"إفشاء خطير للسرية وتجاوز لأخلاقيات الكوتشينج المهنية."}],reference:"مدونة الأخلاقيات: المعايير 2 و3 و4 (علاقة الراعي والعميل والسرية).",referenceDetail:"الراعي يدفع التكلفة لكن العميل هو صاحب المساحة الآمنة؛ لا يجوز مطلقاً مشاركة محتوى الجلسات دون تفويض كتابي صريح من العميل.",keyTakeaway:"تمويل الراعي للجلسات لا يمنحه أي حق في انتهاك سرية ما يدور داخلها."},{id:3,competencyId:3,standardId:1,topic:"تأسيس اتفاقية الجلسة المحددة (Session Agreement)",category:"الاتفاقيات",difficulty:"متوسط",scenario:"في بداية الجلسة الثالثة، بدأ العميل بالحديث بتشويش عن ضغوط العمل، ومشاكل أسرية، ورغبته في إعداد عرض تقديمي، وتغيير عاداته الرياضية. كيف يقود كوتش الـ ACC الجلسة وفقاً للجدارة 3؟",options:[{letter:"أ",text:"يختار الكوتش مشكلة العرض التقديمي لأنها الأسهل حلاً ويوجه الحديث نحوها لإنهاء الجلسة بإنجاز ملموس وسريع.",isCorrect:!1,feedback:"غير صحيح. هذا فرض لأجندة الكوتش وتجاوز لشراكة العميل، وينتهك صلب الجدارة 3 و2."},{letter:"ب",text:'يعكس الكوتش للعميل بوضوح الموضوعات المتعددة التي طرحها، ويسأله: "لقد ذكرت عدة جوانب مهمة؛ ما هو الجانب الذي ترغب بتركيز طاقتنا عليه اليوم لتحقيق أكبر قيمة لك بنهاية وقتنا؟ وكيف ستعرف أننا نجحنا في ذلك؟".',isCorrect:!0,feedback:"إجابة ممتازة ومطابقة للمؤشرات السلوكية للجدارة 3 (3.1 و3.2 و3.3). الكوتش يعكس المواضيع، يتيح للعميل اختيار النتيجة المستهدفة، ويؤسس معيار النجاح للجلسة."},{letter:"ج",text:"يترك العميل يسترسل في الحديث عن جميع المشكلات طوال الـ 45 دقيقة دون مقاطعة كدليل على حسن الاستماع.",isCorrect:!1,feedback:"غير صحيح. الاستماع النشط لا يعني غياب الاتفاقية وإدارة التركيز. الجدارة 3 تتطلب وضع اتفاق واضح ومعايير نجاح للجلسة في أول 10-15 دقيقة."},{letter:"د",text:"يطلب من العميل مغادرة الجلسة وكتابة قائمة بأولوياته في جدول إكسل والعودة بها في الأسبوع القادم.",isCorrect:!1,feedback:"تصرف تسلطي وطرد مقنع للعميل؛ دور الكوتش هو الشراكة معه لمساعدته على بلورة أولوياته داخل الجلسة."}],reference:"الجدارات الأساسية المحدثة: الجدارة رقم 3 (تأسيس الاتفاقيات والحفاظ عليها).",referenceDetail:"المؤشر 3.2 و3.3: يشارك العميل في تحديد ما يريد إنجازه في الجلسة ومعايير النجاح المنشودة.",keyTakeaway:"جلسة الكوتشينج بدون اتفاق محدد ومعيار نجاح معلن تصبح مجرد دردشة ودية غير مهنية."},{id:4,competencyId:2,standardId:13,topic:"عقلية الكوتشينج والامتناع عن إعطاء الحلول",category:"عقلية الكوتشينج",difficulty:"صعب",scenario:'يقول العميل بحيرة بالغة: "لقد جربت كل الطرق لتنظيم وقت فريقي وفشلت تماماً، أنت لديك خبرة 15 عاماً في الإدارة وتعرف كيف تدار الأمور في كبرى الشركات، بالله عليك أخبرني بالحل الذي يجب أن أطبقه غداً؟". ما هو رد الكوتش الأكثر توافقاً مع الجدارة 2 و7؟',options:[{letter:"أ",text:"يستجيب الكوتش لطلبه ويشرح له أفضل 3 برمجيات لإدارة المهام بناءً على خبرته الطويلة ليوفر عليه الوقت والجهد.",isCorrect:!1,feedback:"غير صحيح. هذا تحول إلى دور المستشار أو المدرب ويسلب العميل مسؤوليته وقوته في ابتكار حلوله الخاصة، مخالفاً للجدارة 2 (عقلية الكوتشينج)."},{letter:"ب",text:'يعترف الكوتش برغبة العميل القوية في الحصول على حل سريع، ثم يعيد إليه الشراكة بسؤال: "أقدّر رغبتك في الوصول لحل فوري ومجرب؛ لكن من واقع فهمك الأعمق لطبائع أفراد فريقك وسياقهم، ما الشيء المختلف الذي إذا جربته سيصنع فارقاً حقيقياً؟".',isCorrect:!0,feedback:"إجابة نموذجية لاختبار ACC! الكوتش يحافظ على عقلية الكوتشينج، يؤمن بأن العميل هو الخبير بسياقه، ويعيد توجيه القوة للعميل للتفكير دون أن يتقمص دور الخبير."},{letter:"ج",text:'يقول له بصرامة: "أنا كوتش معتمد وممنوع علي قانونياً بموجب ICF أن أعطيك أي نصيحة".',isCorrect:!1,feedback:"غير صحيح. الرد فج وبارد ويهدم الثقة والأمان (الجدارة 4)، ولا يساعد العميل على الاستكشاف برفق وشراكة."},{letter:"د",text:"يعرض عليه حلاً واحداً فقط ويطلب منه الالتزام به كتجربة أسبوعية واحدة.",isCorrect:!1,feedback:"إعطاء الحلول مرفوض في الكوتشينج حتى لو كان خياراً واحداً؛ الحل ينبع دائماً من بصيرة العميل."}],reference:"الجدارات الأساسية: الجدارة 2 (تجسيد عقلية الكوتشينج) والجدارة 7 (إثارة الوعي).",referenceDetail:"يدرك الكوتش أن العميل مسؤول عن خياراته، ولا يستجيب لإغراء تقديم النصائح حتى عندما يطلب العميل ذلك بإلحاح.",keyTakeaway:"دور الكوتش ليس إعطاء إجابات العميل، بل إثارة قدرة العميل على إيجاد أفضل إجاباته الخاصة."},{id:5,competencyId:5,standardId:0,topic:"قوة الصمت والحفاظ على الحضور",category:"الحضور",difficulty:"متوسط",scenario:'أثناء استكشاف دافع رئيسي وراء تردد العميل، وجه الكوتش سؤالاً عميقاً: "ما الذي قد تخسره في حقيقتك لو حققت هذا النجاح الكبير؟". صمت العميل تماماً وتوقف عن الكلام لمدة 25 ثانية وهو ينظر في الفراغ متأملاً. ما هو الإجراء الأفضل للكوتش؟',options:[{letter:"أ",text:"كسر حاجز الصمت بسؤال تفسيري أو إعادة صياغة السؤال السابق ظناً منه أن العميل لم يفهم السؤال جيداً.",isCorrect:!1,feedback:"غير صحيح. مقاطعة الصمت تقطع حبل التفكير التأملي العميق للعميل وتمنعه من الوصول للبصيرة (ينتهك الجدارة 5)."},{letter:"ب",text:"البقاء في حالة حضور هادئ، متيقظ، ومطمئن بالصمت، وإتاحة المساحة الزمنية الكاملة للعميل حتى يستوعب مشاعره ويبادر هو بالحديث عندما يكتمل تفكيره.",isCorrect:!0,feedback:"إجابة صحيحة تماماً! الصمت هو أحد أقوى تجليات الجدارة 5 (الحفاظ على الحضور) والجدارة 7 (إثارة الوعي). الصمت يمنح العميل مساحة المعالجة الداخلية دون استعجال."},{letter:"ج",text:"الاعتذار للعميل عن إحراجه بهذا السؤال الصعب واقتراح الانتقال إلى موضوع آخر أخف وطأة.",isCorrect:!1,feedback:"غير صحيح. هذا يعكس عدم راحة الكوتش الذاتية مع الصمت ومشاعر العميل، وهو ضعف في تنظيم مشاعر الكوتش (الجدارة 2 و5)."},{letter:"د",text:"البدء بتسجيل ملاحظات كتابية سريعة بصوت مسموع لملء وقت الفراغ أثناء صمت العميل.",isCorrect:!1,feedback:"تصرف يشتت العميل ويفسد الحضور الروحي والذهني في اللحظة الراهنة."}],reference:"الجدارات الأساسية المحدثة: الجدارة 5 (الحفاظ على الحضور - المؤشر 5.5).",referenceDetail:"المؤشر 5.5: يخلق الكوتش مساحة للصمت أو التفكير أو الوقوف دون استعجال لخدمة العميل.",keyTakeaway:"الصمت هو المساحة التي يولد فيها الوعي الذاتي؛ لا تسرق بصيرة العميل بمقاطعته."},{id:6,competencyId:6,standardId:0,topic:"الاستماع النشط وملاحظة التناقضات غير المنطوقة",category:"الاستماع النشط",difficulty:"صعب",scenario:'يتحدث العميل عن خططه لتغيير مساره الوظيفي ويقول بحماس لفظي مفتعل: "أنا في قمة السعادة بهذا التحدي الجديد!"، ولكن نبرة صوته كانت متهدجة وعيناه تفيضان بالدموع وكتفاه منقبضان بوضوح. كيف يعكس كوتش الـ ACC ذلك بأعلى درجات المهارة؟',options:[{letter:"أ",text:"يتجاهل لغة جسده ويركز فقط على كلماته الإيجابية ويطلب منه وضع جدول زمني للتغيير الوظيفي.",isCorrect:!1,feedback:"غير صحيح. هذا استماع سطحي للكلمات فقط وإهمال صريح لما لم يُقل ولغة الجسد والنبرة، مخالفاً للجدارة 6."},{letter:"ب",text:'يشارك الكوتش ملاحظته بحياد ودون أحكام: "سمعتك تقول أنك في قمة السعادة، وفي نفس الوقت لاحظت نبرة صوت منخفضة ودموعاً في عينيك؛ ما الذي تعبر عنه هذه الدموع في هذه اللحظة؟".',isCorrect:!0,feedback:"إجابة نموذجية ومثالية للجدارة 6 (الاستماع النشط - المؤشرات 6.1 و6.5). الكوتش يلتقط التناقض بين المنطوق ولغة الجسد ويعكسه بشفافية واحترام لإثارة الوعي."},{letter:"ج",text:'يقول له فوراً: "أنت لست سعيداً بل أنت خائف ومرعوب من الفشل في الوظيفة الجديدة، أليس كذلك؟".',isCorrect:!1,feedback:"غير صحيح. هذا تفسير وافتراض فج وإصدار أحكام يفرضه الكوتش على العميل، ويهدم الثقة والأمان (الجدارات 4 و6 و7)."},{letter:"د",text:"يمدح قدرته العالية على إخفاء حزنه ويطلب منه التركيز على الجوانب المالية فقط.",isCorrect:!1,feedback:"تعليق سطحي يهرب من العمق الإنساني والمشاعر الحقيقية للجلسة."}],reference:"الجدارات الأساسية: الجدارة 6 (الاستماع النشط) والجدارة 7 (إثارة الوعي).",referenceDetail:"يستمع الكوتش لما يقوله وما لا يقوله العميل، ويلتقط التغيرات في نبرة الصوت والمشاعر دون فرض تفسيرات شخصية.",keyTakeaway:"الكوتش يعكس الملاحظة كما هي ويترك المعنى والتفسير للعميل نفسه."},{id:7,competencyId:7,standardId:0,topic:"إثارة الوعي وتحدي المعتقدات المقيدة",category:"إثارة الوعي",difficulty:"متوسط",scenario:'يكرر العميل للمرة الثالثة عبارة: "في شركتنا، لا يمكن لأي شخص أن يترقى إلا إذا قدم تنازلات عن مبادئه وأخلاقه، هذا قانون الكون هنا!". أي سؤال يثير الوعي بأعلى درجات الفعالية والشراكة وفقاً لـ ICF؟',options:[{letter:"أ",text:'"لماذا تقول هذا الكلام السلبي والمحبط؟ ألا يوجد مدراء شرفاء في شركتك؟".',isCorrect:!1,feedback:'غير صحيح. سؤال يبدأ بـ "لماذا" بنبرة دفاعية اتهامية تدفع العميل للتبرير والمقاومة بدل الاستكشاف.'},{letter:"ب",text:'"ما الدليل الحاسم الذي جعلك تعتبر هذا الافتراض قانوناً كونياً؟ وكيف تؤثر رؤيتك هذه على خياراتك وسلوكك المهني الآن؟".',isCorrect:!0,feedback:"إجابة ممتازة! سؤال مفتوح يدعو العميل لفحص المعتقد المقيد والافتراضات دون هجوم، ويستكشف أثره الحقيقي على واقعه وسلوكه (الجدارة 7)."},{letter:"ج",text:'"أنصحك بقراءة كتاب في القيادة الأخلاقية وسأرسل لك رابطه بعد الجلسة".',isCorrect:!1,feedback:"غير صحيح. إسداء النصائح وتقديم مصادر تدريبية يخرج عن دور الكوتشينج إلى التوجيه والتدريب."},{letter:"د",text:'"هل تقصد أنك تفكر في التنازل عن مبادئك لنيل الترقية؟".',isCorrect:!1,feedback:"سؤال مغلق واتهامي يثير الحرج ويهدم الثقة والأمان بين الطرفين."}],reference:"الجدارات الأساسية: الجدارة 7 (إثارة الوعي - المؤشر 7.2 و7.1).",referenceDetail:"يطرح الكوتش أسئلة تساعد العميل على استكشاف أنماط تفكيره ومعتقداته التي تحد من إمكاناته وتؤثر على سلوكه.",keyTakeaway:"الأسئلة القوية تفكك القناعات المعطلة برفق وتكشف زوايا نظر جديدة."},{id:8,competencyId:8,standardId:0,topic:"تسهيل نمو العميل والمساءلة الذاتية",category:"تسهيل النمو",difficulty:"متوسط",scenario:"في الدقائق العشر الأخيرة من الجلسة، توصل العميل إلى بصيرة مفادها أنه يحتاج إلى إجراء محادثة مصارحة حاسمة مع شريكه في العمل. كيف يسهل كوتش الـ ACC الخطوة القادمة؟",options:[{letter:"أ",text:'يطلب الكوتش من العميل: "أريدك أن تتصل به غداً في التاسعة صباحاً وتكتب لي رسالة واتساب فور انتهائك من المكالمة لتؤكد إنجاز المهمة".',isCorrect:!1,feedback:"غير صحيح. الكوتش هنا يحدد الخطوة، الوقت، وطريقة التفتيش، ممارساً دور الرقيب أو المدير وليس الشريك (مخالف للجدارة 8)."},{letter:"ب",text:'يسأل الكوتش العميل: "بناءً على هذه البصيرة، ما الخطوة الملموسة التي تختار القيام بها؟ متى سترى من المناسب تنفيذها؟ وكيف تحب أن تتابع التزامك بها؟".',isCorrect:!0,feedback:"إجابة ممتازة ومطابقة لمعايير ICF (الجدارة 8). العميل هو من يختار الفعل، التوقيت، ونظام المساءلة والمتابعة الذاتية بشراكة الكوتش."},{letter:"ج",text:"ينهي الجلسة فوراً ليوفر وقت العميل متمنياً له التوفيق في المحادثة القادمة دون أي خطة.",isCorrect:!1,feedback:"غير صحيح. إغفال تحويل الوعي إلى خطة عمل والتزام يترك الجلسة غير مكتملة الأثر العملي (ينتهك الجدارة 8)."},{letter:"د",text:"يقترح عليه أن يكتب رسالة بالبريد الإلكتروني بدلاً من الاتصال الهاتفي تجنباً للانفعالات.",isCorrect:!1,feedback:"فرض لطريقة تنفيذية من عقل الكوتش بدلاً من تمكين العميل من اختيار الوسيلة التي تناسبه."}],reference:"الجدارات الأساسية: الجدارة 8 (تسهيل نمو العميل - المؤشرات 8.2 و8.3 و8.5).",referenceDetail:"يتعاون الكوتش مع العميل لتصميم خطوات العمل والمساءلة وتحديد الموارد والعقبات بشراكة تامة.",keyTakeaway:"المساءلة في الكوتشينج هي مساءلة العميل لنفسه، وليست خضوع العميل لرقابة الكوتش."},{id:9,competencyId:1,standardId:21,topic:"تضارب المصالح المزدوج مع العملاء",category:"الأخلاقيات",difficulty:"صعب",scenario:"كوتش مستقل يعمل مع الرئيس التنفيذي لإحدى الشركات التقنية. بعد شهرين، تواصل معه نائب الرئيس في نفس الشركة طالباً جلسات كوتشينج خاصة لمساعدته في منافسة الرئيس التنفيذي لنيل قيادة الشركة في التعديل القادم. كيف يتصرف الكوتش أخلاقياً وفقاً لمعايير ICF؟",options:[{letter:"أ",text:"يقبل الطلب فوراً لأن ذلك يضاعف أرباحه ويزيد من إلمامه بسياق الشركة الداخلي وصراعاتها.",isCorrect:!1,feedback:"مخالفة صريحة وخطيرة للمعيار الأخلاقي 21 و5. هذا تضارب مصالح حاد يضر بالحياد والسرية."},{letter:"ب",text:"يقوم بإبلاغ الرئيس التنفيذي فوراً بنيّة نائبه ويحذره منه حفاظاً على أمانة العميل الأول.",isCorrect:!1,feedback:"مخالفة صريحة لمعيار السرية (المعيار 3). لا يجوز إفشاء ما دار مع نائب الرئيس للرئيس التنفيذي."},{letter:"ج",text:"يعتذر لنائب الرئيس بلباقة موضحاً وجود تضارب مصالح يحول دون تقديم الخدمة بحياد تام، ويقترح عليه أسماء كوتشيز مستقلين ومحترفين آخرين دون إفشاء أي سر لأي طرف.",isCorrect:!0,feedback:"إجابة صحيحة وأخلاقية بامتياز! تتماشى مع المعيار 21 والمعيار 7. الكوتش يمتنع عن الدخول في تضارب مصالح، يحفظ سرية الطرفين، ويحيل الكوتش لزملاء آخرين."},{letter:"د",text:"يقبل تقديم الجلسات لنائب الرئيس بشرط أن تتم الجلسات باسم مستعار وسداد نقدي دون فواتير رسمية.",isCorrect:!1,feedback:"احتيال وتضليل مهني وسلوك غير أخلاقي جسيم ينتهك معايير النزاهة والاحترافية."}],reference:"مدونة الأخلاقيات: المعايير 21 (تضارب المصالح) و3 (السرية).",referenceDetail:"يتعين على الكوتش تجنب أي تضارب مصالح قائم أو محتمل، والانسحاب أو الاعتذار الفوري عند عدم إمكانية ضمان الحياد التام.",keyTakeaway:"تجنب تضارب المصالح يسبق دائماً أي مكاسب مالية أو توسع في الأعمال."},{id:10,competencyId:4,standardId:0,topic:"تنمية الثقة واحترام سياق وثقافة العميل",category:"الثقة والأمان",difficulty:"متوسط",scenario:"خلال حديث العميل عن صراعه مع اتخاذ قرار عائلي مصيري، صرح بأنه يتشاور دائماً مع والده المسن ويخضع لرأيه احتراماً للقيم العائلية المتجذرة في مجتمعه. شعر الكوتش (المنتمي لثقافة تؤمن بالفردانية المطلقة) بالاستغراب. ما هو التصرف الأنسب وفقاً للجدارة 4؟",options:[{letter:"أ",text:"تحدي العميل وإخباره بأن التبعية لآراء الوالدين في هذا العمر تمثل علامة ضعف استقلالية يجب التخلص منها فوراً.",isCorrect:!1,feedback:"غير صحيح. هذا فرض للقيم الثقافية الخاصة بالكوتش وإصدار أحكام تهدم الثقة والأمان، مخالف للجدارة 4 (المؤشر 4.1 و4.2)."},{letter:"ب",text:"احترام السياق الثقافي والقيمي للعميل، واستكشاف كيف يوفق العميل بين برّ والده وبين تطلعاته وأهدافه الشخصية في ضوء قيمه الخاصة.",isCorrect:!0,feedback:"إجابة ممتازة ومطابقة لروح الـ ICF! الجدارة 4 تتطلب فهم واحترام هوية العميل وبيئته وقيمه الثقافية دون فرض قوالب جاهزة."},{letter:"ج",text:"تجنب الحديث في أي موضوع يمس العائلة واقتصار الجلسات فقط على مجالات العمل البحتة.",isCorrect:!1,feedback:"غير صحيح. هذا هروب يعيق العميل عن معالجة الأمور الأكثر أهمية له في حياته المتكاملة."},{letter:"د",text:"طلب حضور والد العميل في الجلسة القادمة ليتفاوض معه الكوتش مباشرة حول استقلالية ابنه.",isCorrect:!1,feedback:"تدخل فج يخرق حدود العلاقة المهنية ويقلل من شأن العميل وقدرته على اتخاذ قراراته."}],reference:"الجدارات الأساسية المحدثة: الجدارة 4 (تنمية الثقة والأمان - المؤشرات 4.1 و4.2).",referenceDetail:"يسعى الكوتش لفهم العميل ضمن سياقه وثقافته وقيمه، ويظهر التقدير العميق لخلفيته دون أحكام مسبقة.",keyTakeaway:"الكوتشينج يتمحور حول قيم العميل وسياقه هو، وليس حول قناعات وثقافة الكوتش الشخصية."},{id:11,competencyId:1,standardId:18,topic:"الادعاءات المهنية وشعارات الاعتماد",category:"الأخلاقيات",difficulty:"متوسط",scenario:'كوتش أنهى للتو 60 ساعة تدريبية معتمدة من برنامج كوتشينج، ولكنه لم يكمل بعد ساعات الخبرة المطلوبة ولم يتقدم لاختبار الاتحاد الدولي للكوتشينج (ICF). قام بإنشاء صفحة تجارية وكتب بجوار اسمه: "كوتش معتمد ACC من الاتحاد الدولي للكوتشينج". ما هو الموقف الأخلاقي؟',options:[{letter:"أ",text:"تصرفه مقبول لأن إكمال الساعات التدريبية يعطيه الحق التسويقي لاستخدام اللقب مؤقتاً.",isCorrect:!1,feedback:"غير صحيح. إنهاء التدريب لا يمنح الاعتماد. الاعتماد يتطلب استيفاء ساعات الخبرة واجتياز امتحان الاعتماد الرسمي."},{letter:"ب",text:"هذا انتهاك صريح ومضلل للمعيار الأخلاقي رقم 18 ورقم 10، ويحق لـ ICF اتخاذ تدابير تأديبية بحقه لادعاء اعتماد لم يحصل عليه رسمياً بعد.",isCorrect:!0,feedback:"إجابة صحيحة وقاطعة! المعيار 18 يمنع منعاً باتاً الادعاء الكاذب أو المضلل بشأن ألقاب واعتمادات ICF."},{letter:"ج",text:"يُسمح له بذلك فقط إذا وضع نجمة صغيرة وكتب في الأسفل أنه قيد مراجعة الأوراق.",isCorrect:!1,feedback:"غير صحيح. التضليل ممنوع بأي وسيلة؛ لا يجوز استخدام اللقب المعتمد إلا بعد صدور وثيقة الاعتماد الرسمية."},{letter:"د",text:"التصرف شأن تسويقي داخلي لا علاقة لـ ICF به طالما لم يشتكِ أي عميل رسمياً.",isCorrect:!1,feedback:"مدونة الأخلاقيات تلزم كل من ينتسب لـ ICF بالنزاهة التامة في كافة الأنشطة العامة والتسويقية."}],reference:"مدونة الأخلاقيات: المعيار 18 (التعريف الصادق بالشهادات) والمعيار 10 (عدم التضليل).",referenceDetail:"يحدد الكوتش مؤهلاته واعتماداته بدقة متناهية دون تضليل العملاء أو الجمهور.",keyTakeaway:"النزاهة والصدق في تمثيل المؤهلات والشهادات حجر زاوية في سمعة المهنة."},{id:12,competencyId:2,standardId:14,topic:"إدارة الظروف الشخصية والأداء المهني",category:"عقلية الكوتشينج",difficulty:"صعب",scenario:"يمر الكوتش بظرف عائلي قاهر (حالة حداد شديدة وفقدان مفاجئ لأحد المقربين)، ولديه في نفس اليوم 4 جلسات كوتشينج مجدولة مع عملاء تنفيذيين. يشعر الكوتش بشتات ذهني وعدم قدرة على التماسك. ما هو السلوك الأخلاقي المتوافق مع معايير ICF؟",options:[{letter:"أ",text:"الضغط على نفسه وحضور الجلسات مهما كلف الأمر لإثبات الاحترافية الصارمة والوفاء بالمواعيد التعاقدية.",isCorrect:!1,feedback:"غير صحيح. حضور الكوتش وهو في حالة انهيار يمنعه من تقديم خدمة آمنة وحاضرة، وقد يضر بالعميل وينتهك المعيار 14."},{letter:"ب",text:"الاعتراف بحدوده وظرفه الطارئ، والاعتذار للعملاء بلباقة لطلب إعادة جدولة الجلسات، أو توفير كوتش بديل مؤهل إذا لزم الأمر، حفاظاً على جودة الخدمة وأمانة الحضور.",isCorrect:!0,feedback:"إجابة صحيحة ومثالية! المعيار 14 يطالب الكوتش بالاعتراف بالمشكلات الشخصية أو القيود التي قد تتعارض مع الأداء وتعليق العمل عند الحاجة."},{letter:"ج",text:"حضور الجلسة وتوجيه الحديث للعميل ليشاركه الكوتش مشاكله الشخصية ويستشيره فيها.",isCorrect:!1,feedback:"مخالفة صارخة لكافة معايير الكوتشينج. الجلسة مخصصة للعميل فقط وليست متنفساً لمشاكل الكوتش الشخصية."},{letter:"د",text:"تشغيل الجلسات صامتاً مع تشغيل مقاطع فيديو مسجلة للكوتشينج ليتابعها العميل بنفسه.",isCorrect:!1,feedback:"سلوك استخفافي يخل بصلب عملية الكوتشينج القائمة على الحضور التفاعلي والشراكة اللحظية."}],reference:"مدونة الأخلاقيات: المعيار 14 (الاعتراف بالقيود الشخصية وتعليق العمل).",referenceDetail:"يدرك الكوتش أي ظرف صحي أو شخصي يعوق كفاءته وحضوره ويسعى للمساعدة أو يعلق الجلسات بمسؤولية.",keyTakeaway:"الاعتراف بالضعف البشري وتعليق الجلسات عند الأزمات القاسية هو قمة الاحترافية والأمانة الأخلاقية."},{id:13,competencyId:3,standardId:0,topic:"تغيير اتجاه الجلسة في المنتصف (Shifting Focus)",category:"الاتفاقيات",difficulty:"صعب",scenario:'في منتصف جلسة كان هدفها المتفق عليه "إعداد استراتيجية العرض التقديمي لمجلس الإدارة"، توقف العميل فجأة وقال بتأثر: "في الحقيقة لا أستطيع التفكير في العرض، ما يشغل بالي ويرهقني حقيقةً هو شجار عنيف حدث بيني وبين شريكي المؤسس هذا الصباح!". كيف يتصرف الكوتش المحترف وفقاً للجدارة 3 و5؟',options:[{letter:"أ",text:"يصر الكوتش على استكمال العرض التقديمي لأن وقت الجلسة محدد والهدف تم التعاقد عليه في البداية ولا يجوز الإخلال به نهائياً.",isCorrect:!1,feedback:"غير صحيح. هذا جمود وتشبث بالأجندة ينتهك مرونة الحضور (الجدارة 5) والشراكة مع العميل."},{letter:"ب",text:'يشارك الكوتش العميل في إعادة تأسيس الاتفاقية: يعترف بما طرأ، ويسأله: "يبدو أن هذا الموقف يستحوذ على كامل طاقتك واهتمامك الآن؛ هل ترغب في تعديل مسار جلستنا اليوم للتركيز عليه، أم تفضل استكمال هدفنا الأصلي؟".',isCorrect:!0,feedback:"إجابة صحيحة ومثالية! المؤشر 3.7 و3.6: الكوتش يواصل الكوتشينج بما يتوافق مع العميل ويدير الوقت والتركيز بشراكة، ويكون مرناً عندما يقرر العميل تغيير الاتجاه."},{letter:"ج",text:"ينتقل مباشرة للتحقيق في تفاصيل الشجار وسماع القصة دون إعادة التعاقد أو استئذان العميل.",isCorrect:!1,feedback:"غير صحيح. الانتقال التلقائي دون إعادة صياغة اتفاق الجلسة يفقد الجلسة بوصلتها وموافقة العميل الواعية."},{letter:"د",text:"ينهي الجلسة فوراً ويطلب منه حجز جلسة جديدة منفصلة لدفع رسوم إضافية لمناقشة المشكلة الجديدة.",isCorrect:!1,feedback:"سلوك استغلالي غير مهني يهدم روح الشراكة والأمانة في إدارة وقت الجلسة التعاقدية."}],reference:"الجدارات الأساسية المحدثة: الجدارة 3 (المؤشر 3.7) والجدارة 5 (الحفاظ على الحضور).",referenceDetail:"يتشارك الكوتش مع العميل في إدارة التركيز، ويعدل اتجاه الجلسة بمرونة ووضوح متى ما اختار العميل ذلك.",keyTakeaway:"الجلسة ملك للعميل؛ عند ظهور أولوية طاغية، يعيد الكوتش الاتفاق بشفافية ورشاقة."},{id:14,competencyId:7,standardId:0,topic:"مشاركة الحدس والملاحظة دون تعلق (Detachment)",category:"إثارة الوعي",difficulty:"صعب",scenario:"أثناء حديث العميل عن علاقته بفريقه، شعر الكوتش بحدس داخلي قوي بأن العميل يتجنب الحسم خوفاً من ألا يكون محبوباً. كيف يشارك الكوتش هذا الحدس وفقاً للجدارة 7؟",options:[{letter:"أ",text:'يقول الكوتش بثقة: "أنا كوتش خبير وحدسي لا يخطئ أبداً؛ مشكلتك الحقيقية هي رغبتك الطفولية في كسب حب الجميع، وعليك التخلص منها فوراً".',isCorrect:!1,feedback:"مخالفة جسيمة! تشخيص تحليلي متسلط وتشبث مطلق بصحة الحدس ينتهك الجدارات 4 و7 و2."},{letter:"ب",text:"يكتم الكوتش حدسه تماماً ولا يشاركه أبداً لأن الكوتشينج يعتمد فقط على ما ينطق به العميل حرفياً.",isCorrect:!1,feedback:"غير دقيق. الجدارة 7 (المؤشر 7.3) تشجع الكوتش على مشاركة الملاحظات والحدس والمشاعر الصادقة كمرآة للعميل ولكن دون تعلق بصحتها."},{letter:"ج",text:'يشارك الكوتش الملاحظة بخفة وتواضع: "إذا سمحت لي، راودني حدس وأنا أستمع إليك قد يكون صائباً أو خاطئاً؛ شعرت وكأن هناك رغبة عميقة لديك في الحفاظ على حب الجميع قد تتردد بسببها في الحسم.. كيف يتردد صدى هذا الشعور بداخلك؟".',isCorrect:!0,feedback:"إجابة ممتازة ومعيارية لاختبار ACC! المؤشر 7.3: يشارك الكوتش الحدس والملاحظة دون تشبث، ويدعو العميل لاستكشاف مدى صحتها أو معناها بالنسبة له بحرية تامة."},{letter:"د",text:'يسأل العميل: "ألا تشعر بالخجل من التردد أمام فريق عملك وأنت قائد كبير؟".',isCorrect:!1,feedback:"سؤال يوجه الإهانة واللوم للعميل، وينسف الأمان النفسي والاحترام المتبادل."}],reference:"الجدارات الأساسية المحدثة: الجدارة 7 (إثارة الوعي - المؤشر 7.3).",referenceDetail:"يشارك الملاحظات والحدس والرؤى دون التعلق بصحتها، ويترك للعميل المساحة الكاملة لتأكيدها أو نفيها.",keyTakeaway:"الحدس في الكوتشينج هو دعوة للاستكشاف، وليس حكماً أو تشخيصاً يُفرض على العميل."},{id:15,competencyId:1,standardId:8,topic:"الهدايا الثمينة وتجنب الاستغلال والحدود المهنية",category:"الأخلاقيات",difficulty:"متوسط",scenario:"في ختام برنامج كوتشينج استمر 6 أشهر، قدم لك العميل (رجل أعمال ثري) هدية عبارة عن ساعة يد فاخرة تتجاوز قيمتها 15 ألف دولار مع دعوة لقضاء عطلة مجانية في منتجعه الخاص تقديراً لجهودك معه. كيف يتصرف الكوتش الملتزم بأخلاقيات ICF؟",options:[{letter:"أ",text:"قبول الهدية والرحلة فوراً باعتبارها مكافأة مستحقة عن نجاح الكوتشينج وإكراماً لكرم العميل وحسن ضيافته.",isCorrect:!1,feedback:"غير صحيح. قبول هدايا باهظة ومنافع شخصية يخل بالحدود المهنية والاستقلالية وقد ينتهك المعيار الأخلاقي 8 و23."},{letter:"ب",text:"التعبير عن الشكر والامتنان الصادق لمشاعره وتقديره لرحلة نموه، والاعتذار بلباقة عن قبول الهدية الفاخرة أو الرحلة موضحاً سياسة الأخلاقيات المهنية لـ ICF التي تحافظ على الحدود المهنية الصارمة بين الكوتش والمستفيد.",isCorrect:!0,feedback:"إجابة صحيحة وأخلاقية رصينة! المعيار 8 والمعيار 23 يحثان على تجنب أي منفعة غير متناسبة تثير شبهة الاستغلال أو تخل بالحدود والسمعة المهنية."},{letter:"ج",text:"توبيخ العميل واتهامه بمحاولة رشوته وتهديده بإنهاء العلاقة فوراً وتقديم بلاغ للشرطة.",isCorrect:!1,feedback:"رد فعل متطرف وعدواني يفتقر إلى اللباقة والاحترام (الجدارة 4 وقيم ICF الأساسية)."},{letter:"د",text:"قبول الساعة فقط مع التنازل عن الرحلة لتسوية الموقف بشكل وسط.",isCorrect:!1,feedback:"الساعة الفاخرة (15 ألف دولار) تظل منفعة باهظة تخرق الحدود المهنية والنزاهة المستقلة."}],reference:"مدونة الأخلاقيات: المعيار 8 (تجنب الاستغلال) والمعيار 23 (صون سمعة المهنة والحدود المهنية).",referenceDetail:"يضع الكوتش حدوداً مهنية واضحة ولا يقبل هدايا أو منافع باهظة قد تؤثر على النزاهة والحياد.",keyTakeaway:"الحدود المهنية تحمي قدسية العلاقة ونزاهة الكوتش والعميل على حد سواء."},{id:16,competencyId:1,standardId:7,topic:"الصدمات النفسية السابقة (PTSD) وحدود الكوتشينج",category:"الإحالة ومتخصصين",difficulty:"صعب",scenario:"عميل حجز جلسات كوتشينج لتحسين مهارات القيادة. كلما وصل الحوار لموقف يتطلب المواجهة، يدخل العميل في نوبة بكاء وارتجاف وهلع شديد مسترجعاً تفاصيل حادث سير مروع وإصابة جسدية بليغة تعرض لها قبل عامين، قائلاً إنه يعيش الكابوس يومياً. ما هو تصرف الكوتش الأخلاقي؟",options:[{letter:"أ",text:"تطبيق تقنيات البرمجة اللغوية العصبية أو إزالة التحسس ومحاولة علاج فوبيا الحوادث داخل الجلسة.",isCorrect:!1,feedback:"خطأ جسيم وخطير جداً! الكوتش ليس معالج صدمات (Trauma Therapist). محاولة علاج الصدمات دون تدريب طبي ونفسي مرخص يعرض العميل لإعادة الصدمة (Retraumatization) وينتهك المعيار 7 و11."},{letter:"ب",text:"التعاطف مع ألم العميل، وإيضاح أن هذه الأعراض مرتبطة بآثار صدمة الحادث وتتطلب رعاية متخصصة من معالج نفسي مرخص لعلاج اضطراب ما بعد الصدمة (PTSD)، واقتراح الإحالة لذلك المتخصص مع إمكانية استئناف الكوتشينج القيادي لاحقاً بعد تعافي العميل.",isCorrect:!0,feedback:"إجابة مثالية ومطابقة لدليل اعتبارات الأخلاقيات (ICE) والمعيار 7. الكوتش يدرك حدود المهنة ويحمي أمان العميل النفسي بالإحالة لمتخصص الصدمات."},{letter:"ج",text:"تجاهل نوبة البكاء ومطالبة العميل بأن يكون قوياً ويفصل بين ماضيه الأليم ومهامه القيادية الحالية.",isCorrect:!1,feedback:"غير إنساني وغير مهني مطلقاً؛ يهدم الأمان النفسي وينكر معاناة العميل الحقيقية."},{letter:"د",text:"تقديم جلسات إضافية مجانية لتحفيزه بعبارات التنمية البشرية ليقاوم الكوابيس بإرادته.",isCorrect:!1,feedback:"الكوابيس واضطراب ما بعد الصدمة حالة طبية إكلينيكية لا تعالج بالتحفيز السطحي أو الشعارات."}],reference:"أدلة اعتبارات الأخلاقيات (ICE) والمعيار 7 (الإحالة إلى متخصصين).",referenceDetail:"أعراض الصدمة غير المعالجة (نوبات الهلع، الاسترجاع) تقع خارج نطاق الكوتشينج وتتطلب إحالة متخصصة فورية.",keyTakeaway:"الكوتشينج يعمل مع الأشخاص المتعافين وظيفياً؛ الصدمات النشطة تتطلب علاجاً نفسياً متخصصاً أولاً."},{id:17,competencyId:4,standardId:0,topic:"تجاوز حدود الدور المهني وإسداء النصائح الشخصية",category:"الثقة والأمان",difficulty:"صعب",scenario:"أثناء جلسة كوتشينج، كشف العميل أنه يواجه مشكلة في اختيار التخصص الجامعي لابنه الأكبر ويشعر بالحيرة بين دراسة الطب أو إدارة الأعمال. الكوتش حاصل على شهادة في الطب سابقاً. ما هو التصرف الذي يعكس التزام الكوتش بأعلى معايير ICF؟",options:[{letter:"أ",text:"استغلال تخصصه الطبي السابق لتقديم شرح وافٍ للعميل عن صعوبات دراسة الطب مقارنة بإدارة الأعمال وتوجيه العميل لترجيح إدارة الأعمال لابنه.",isCorrect:!1,feedback:"غير صحيح. هذا استغلال لدور الكوتش لفرض نصائح وخبرات شخصية، وتجاوز لدور الشراكة والحياد."},{letter:"ب",text:"مساعدة العميل على استكشاف المعايير والقيم العائلية والتربوية التي يود الاستناد إليها لدعم ابنه في اتخاذ قراره المستقل، وكيف يحب أن يدير الحوار مع ابنه.",isCorrect:!0,feedback:"إجابة صحيحة ومثالية! الكوتش لا يتدخل في ترجيح التخصص ولا يملي قرارات أسرية، بل يركز على تمكين العميل من إدارة دوره كأب داعم وفق قيمه الخاصة."},{letter:"ج",text:"رفض التحدث في الموضوع فوراً وإنهاء الجلسة لأن الموضوع يخص ابن العميل وليس العميل شخصياً.",isCorrect:!1,feedback:"تصرف فج؛ دور العميل كأب وقلقه هو جزء أصيل من واقعه الحياتي الذي يمكن تناوله بالكوتشينج دون تجاوز الحدود."},{letter:"د",text:"عرض تقديم جلسة كوتشينج مشتركة مجانية مع الابن لإقناعه بالطب.",isCorrect:!1,feedback:"محاولة توجيهية تفتقر للشراكة وتخل بعقد الكوتشينج المبدئي مع العميل."}],reference:"الجدارات الأساسية: الجدارة 4 (تنمية الثقة) والجدارة 2 (عقلية الكوتشينج).",referenceDetail:"يحافظ الكوتش على دوره كشريك وميسر للوعي ولا يخلط بين تجاربه الشخصية السابقة وبين استقلالية خيارات العميل.",keyTakeaway:"حتى لو كان الكوتش خبيراً في موضوع العميل، يظل دوره تيسير تفكير العميل وليس إصدار الفتاوى المهنية."},{id:18,competencyId:6,standardId:0,topic:"الاستماع النشط ومقاطعة السرد القصصي المطول",category:"الاستماع النشط",difficulty:"صعب",scenario:"استغرق العميل 15 دقيقة في سرد تفاصيل دقيقة للغاية عن خلاف بين اثنين من موظفيه حول مواعيد الإجازات، وهو يكرر نفس الأحداث بتوتر دون الوصول لأي مغزى يخص هدفه القيادي للجلسة. كيف يتدخل كوتش الـ ACC ببراعة وفقاً للجدارات 3 و5 و6؟",options:[{letter:"أ",text:"الاستمرار في الصمت التام طوال الجلسة حتى لو استهلك العميل الوقت كله، احتراماً لحقه في التعبير.",isCorrect:!1,feedback:"غير صحيح. الجدارة 3 و5 و6 تتطلب من الكوتش إدارة الوقت وتركيز الجلسة بلباقة وشراكة، وعدم ترك العميل يغرق في الدوران حول القصص السطحية."},{letter:"ب",text:'مقاطعة العميل بلباقة واعتراف: "عذراً لمقاطعتك؛ أرى مدى تعقيد هذه التفاصيل التي تشغلك، ولكن اسمح لي أن أسألك: كيف يرتبط هذا الموقف بهدفك القيادي الذي اتفقنا على تحقيقه في جلستنا اليوم؟".',isCorrect:!0,feedback:"إجابة ممتازة! التدخل اللبق لإعادة ضبط بوصلة الجلسة (Bottom-Lining) يعكس الجدارة 3 (إدارة الاتفاقية والوقت) والجدارة 6 (الاستماع للجوهر وراء القصة)."},{letter:"ج",text:"مقاطعة العميل بنبرة غاضبة وتذكيره بأن وقت الجلسة مدفوع بالدقيقة وعليه التوقف عن إضاعة الوقت.",isCorrect:!1,feedback:"سلوك فظ يهدم الثقة والأمان تماماً."},{letter:"د",text:"البدء بحل النزاع وإصدار حكم حول من يستحق الإجازة من الموظفين.",isCorrect:!1,feedback:"تحول خطير لدور الحكم أو المستشار الإداري خارج حدود الكوتشينج."}],reference:"الجدارات الأساسية المحدثة: الجدارة 3 (الاتفاقيات وإدارة الوقت) والجدارة 6 (الاستماع النشط).",referenceDetail:"يدير الكوتش الوقت وتركيز الجلسة بشراكة تامة مع العميل، ويساعده على تجاوز السرد التفصيلي إلى جوهر التعلم والنمو.",keyTakeaway:"الكوتش يصغي للعميل (Who) وليس فقط لتفاصيل القصة (What)، ويعيد توجيه التركيز بلباقة."}];qt.push(...Xg);function zs(d,p){if(p==="ar")return d;switch(d){case"أ":return"A";case"ب":return"B";case"ج":return"C";case"د":return"D";default:return d}}const pr={1:{topic:"Mental Health Client Referral",category:"Referral & Professionals",scenario:'During the 4th coaching session, the client breaks down in tears and shares feeling overwhelming despair, being unable to get out of bed for over a month, and frequently thinking "everyone would be better off if I just disappeared". How should an ICF ACC certified coach respond?',options:[{letter:"أ",text:"Empathize with the client and ask about next week’s goals using the GROW model to distract them from negative thoughts and push for positive action.",feedback:"Completely incorrect. This is a severe red flag indicating potential self-harm or clinical depression. Applying GROW or ignoring suicide ideation is professional negligence violating Standard 7."},{letter:"ب",text:"Acknowledge the emotions with compassion, explain that these symptoms require specialized mental health support, and recommend an immediate referral to a licensed therapist while suspending coaching sessions.",feedback:"Correct and ideal! Perfectly aligns with ICF Ethical Standard 7 and the ICE Referral Guidelines. When indicators of self-harm or clinical disorders arise, the coach must show support and refer immediately."},{letter:"ج",text:"Conduct a deep meditation session to release trauma, and recommend herbal supplements to improve their mood and sleep.",feedback:"Severe ethical violation (Standards 11 & 1). A coach is neither a therapist nor a physician and cannot prescribe remedies or clinical treatments."},{letter:"د",text:"Offer a 10-minute tea break and then continue discussing career goals so paid session time is not wasted.",feedback:"Cold and dangerous response that denies the client’s psychological safety and crisis state."}],reference:"Code of Ethics: Standard 7 (Referral) & Competency 1 (Ethical Practice)",referenceDetail:"ICF ethics mandate suggesting other support professionals when the client would be better served elsewhere or when safety is at risk.",keyTakeaway:"Thoughts of self-harm and severe depression are non-negotiable red flags requiring immediate referral."},2:{topic:"Confidentiality vs Sponsor Pressure",category:"Ethics & Standards",scenario:"You receive an urgent call from the HR Director (the sponsor funding a corporate coaching contract for an employee). The director demands details on what the employee said about their supervisor and whether they intend to resign, arguing that the company is funding the program and legally entitled to assess ROI. What is the ICF approved action?",options:[{letter:"أ",text:"Provide a very high-level summary of what the employee said without names, respecting that the company is paying the bill.",feedback:"Incorrect. Sharing session content even in generalized form is a direct breach of client confidentiality under Standards 3 & 4."},{letter:"ب",text:"Politely remind the HR Director of the signed coaching agreement and ICF confidentiality rules, clarifying that session discussions are completely confidential, while general attendance reports may only be shared with the client’s prior consent.",feedback:"100% Correct! Standards 3 & 4 mandate strict confidentiality even toward paying sponsors, adhering firmly to initial contracts."},{letter:"ج",text:"Tell the employee in the next session about HR’s request and explain that you are forced to share information because the company paid.",feedback:"Incorrect. This destroys trust and safety (Competency 4) and violates ICF ethics."},{letter:"د",text:"Send the report to the CEO instead of HR to guarantee neutral handling at the executive level.",feedback:"Severe breach of confidentiality and ethics."}],reference:"Code of Ethics: Standards 2, 3 & 4 (Sponsor vs Client & Confidentiality)",referenceDetail:"The sponsor pays the fee, but the client owns the safe space. No session content may ever be disclosed without explicit consent.",keyTakeaway:"Sponsor funding does not grant any right to breach session confidentiality."},3:{topic:"Establishing Session Agreement",category:"Agreements",scenario:"At the start of session 3, the client talks scattered about work pressure, marital tension, preparing an upcoming presentation, and gym habits. How should an ACC coach steer the session according to Competency 3?",options:[{letter:"أ",text:"Pick the presentation challenge because it is the easiest to solve and drive the conversation toward a quick win.",feedback:"Incorrect. This imposes the coach’s agenda and ignores co-creation with the client, violating Competencies 2 & 3."},{letter:"ب",text:'Reflect the multiple topics clearly: "You mentioned several important areas; which one would you like to focus our energy on today for the greatest value by the end of our time, and how will we measure success?".',feedback:"Excellent! Directly meets Core Competency 3 behavioral indicators (3.1, 3.2, 3.3). The coach reflects topics, partners on the goal, and defines success measures."},{letter:"ج",text:"Let the client ramble through all topics for the entire 45 minutes without interruption as proof of deep listening.",feedback:"Incorrect. Active listening does not mean abandoning session agreement and focus management."},{letter:"د",text:"Ask the client to leave, prepare an Excel priority sheet, and return next week.",feedback:"Authoritarian behavior; coaching partners with the client in real time to distill priorities."}],reference:"Core Competency 3: Establishes and Maintains Agreements",referenceDetail:"Indicators 3.2 & 3.3: Partners with the client to define what they want to accomplish in the session and how success will be measured.",keyTakeaway:"A coaching session without a clear agreement and success metric drifts into casual chat."},4:{topic:"Coaching Mindset: Refraining from Giving Solutions",category:"Coaching Mindset",scenario:'The client says in despair: "I tried every technique to manage my team’s time and failed. You have 15 years of executive experience and know how big firms work. Tell me the exact solution I must implement tomorrow!". What is the coach’s response best aligned with Competencies 2 & 7?',options:[{letter:"أ",text:"Answer their request and explain the top 3 task-management software tools based on your experience to save them time.",feedback:"Incorrect. This shifts to consultant/trainer and strips the client of autonomy and problem-solving power (violates Competency 2)."},{letter:"ب",text:'Acknowledge their strong desire for a quick fix, then re-engage partnership: "I appreciate your urge for a proven fix; given your deep understanding of your team’s nature and context, what distinct step could make a real difference if you tried it?".',feedback:"Benchmark ACC response! The coach embodies a coaching mindset, trusts the client as the expert in their context, and evokes self-reliance."},{letter:"ج",text:'Strictly say: "I am an ICF certified coach and legally prohibited by ICF from giving you any advice".',feedback:"Cold and harsh, destroying trust and safety (Competency 4)."},{letter:"د",text:"Offer just one advice as an experimental trial for one week.",feedback:"Giving advice is not coaching, even when reduced to a single suggestion."}],reference:"Core Competency 2 (Coaching Mindset) & Competency 7 (Evokes Awareness)",referenceDetail:"The coach acknowledges client autonomy and resists the temptation to prescribe answers even when urged.",keyTakeaway:"The coach’s role is not to give answers, but to spark the client’s ability to find their best answers."},5:{topic:"Power of Silence & Maintaining Presence",category:"Presence",scenario:'While exploring what holds the client back, the coach asks: "What might you lose in your true self if you attain this massive success?". The client falls completely silent for 25 seconds, gazing into space thoughtfully. What is the coach’s best course of action?',options:[{letter:"أ",text:"Break the silence by rephrasing the question, assuming the client did not understand.",feedback:"Incorrect. Interrupting breaks the reflective thought process and prevents breakthrough insights (Competency 5)."},{letter:"ب",text:"Remain in calm, alert, and reassuring silence, granting full temporal space for the client to process their thoughts and resume speaking when ready.",feedback:"Totally correct! Silence is one of the highest expressions of Competency 5 (Presence) and Competency 7 (Evokes Awareness)."},{letter:"ج",text:"Apologize for asking an awkward question and quickly change the subject.",feedback:"Reflects the coach’s own discomfort with silence, showing weak emotional regulation."},{letter:"د",text:"Start typing noisy keyboard notes to fill the void while the client thinks.",feedback:"Distracting behavior that breaks deep presence and attunement."}],reference:"Core Competency 5: Maintains Presence (Indicator 5.5)",referenceDetail:"Creates space for silence, reflection, or pause without rush to serve the client’s insight.",keyTakeaway:"Silence is the fertile ground where self-awareness blossoms; do not steal the client’s insight by rushing in."},6:{topic:"Active Listening & Non-Verbal Incongruence",category:"Active Listening",scenario:'A client discusses career pivot plans and declares enthusiastically: "I am thrilled about this new challenge!", but their voice wavers, tears well up in their eyes, and their shoulders tense visibly. How should an ACC coach mirror this skillfully?',options:[{letter:"أ",text:"Ignore body language, focus only on positive words, and ask for a career transition timeline.",feedback:"Superficial listening that neglects the unsaid, violating Competency 6."},{letter:"ب",text:'Share the neutral observation without judgment: "I hear you say you are thrilled, and at the same time I noticed your voice softening and tears in your eyes; what are these tears expressing right now?".',feedback:"Flawless active listening (Competency 6, indicators 6.1 & 6.5). Mirrors discrepancy between spoken words and somatic cues neutrally to evoke awareness."},{letter:"ج",text:'Declare immediately: "You are not happy at all, you are terrified of failing in the new role, aren’t you?".',feedback:"Imposing coach interpretations and assumptions, destroying trust and safety (Competencies 4 & 7)."},{letter:"د",text:"Praise their stoic ability to hide sadness and tell them to focus only on salary.",feedback:"Escapes emotional depth and undermines the coaching relationship."}],reference:"Core Competency 6 (Listens Actively) & Competency 7 (Evokes Awareness)",referenceDetail:"Listens to what is said and not said, noting vocal tone and emotional shifts without forcing personal interpretations.",keyTakeaway:"The coach mirrors the observation neutrally and leaves the interpretation entirely to the client."},7:{topic:"Evoking Awareness & Challenging Limiting Beliefs",category:"Evoking Awareness",scenario:'The client repeats for the third time: "In our company, nobody ever gets promoted unless they compromise their ethical principles; that is the universal law here!". Which question evokes awareness with highest efficacy according to ICF?',options:[{letter:"أ",text:'"Why do you say such negative and pessimistic things? Aren’t there honest leaders in your firm?".',feedback:'Defensive, judgmental "Why" question that triggers resistance and justification.'},{letter:"ب",text:'"What compelling evidence led you to hold this as a universal law, and how does holding this belief impact your choices and career today?".',feedback:"Superb! An open question that invites the client to inspect limiting beliefs without feeling attacked (Competency 7)."},{letter:"ج",text:'"I recommend reading a book on ethical leadership and will send you the link after session".',feedback:"Advice giving and mentoring, departing from coaching."},{letter:"د",text:'"Do you mean you are considering compromising your principles to get promoted?".',feedback:"Closed, confrontational query that provokes anxiety."}],reference:"Core Competency 7: Evokes Awareness (Indicators 7.1 & 7.2)",referenceDetail:"Asks open questions that challenge current assumptions and reveal how beliefs influence behavior.",keyTakeaway:"Powerful questions gently dismantle limiting convictions to open new horizons."},8:{topic:"Facilitating Growth & Self-Accountability",category:"Facilitating Growth",scenario:"In the final 10 minutes of a session, the client realizes they must have an honest confrontation with their business co-founder. How does an ACC coach facilitate the next steps?",options:[{letter:"أ",text:'Command the client: "Call them tomorrow at 9 AM sharp and WhatsApp me the moment you finish to prove execution".',feedback:"The coach dictates the action, timing, and inspection, acting as an overseer rather than partner (violating Competency 8)."},{letter:"ب",text:'Inquire with partnership: "With this insight, what tangible step do you choose to take? When feels best to take it, and how would you like to hold yourself accountable?".',feedback:"Model ICF practice (Competency 8). The client owns the action, schedule, and self-accountability structure."},{letter:"ج",text:"End the session immediately to save time, wishing them luck with the talk.",feedback:"Leaves the session without action planning or closure (violates Competency 8)."},{letter:"د",text:"Suggest writing an email instead of calling to avoid emotional volatility.",feedback:"Imposes a method from the coach’s mind rather than empowering the client."}],reference:"Core Competency 8: Facilitates Client Growth (Indicators 8.2, 8.3 & 8.5)",referenceDetail:"Collaborates with the client to design actions, timelines, and self-accountability.",keyTakeaway:"Accountability in coaching is the client answering to themselves, not answering to the coach."},9:{topic:"Dual Conflict of Interest Between Clients",category:"Ethics & Standards",scenario:"An independent coach works with the CEO of a tech company. Two months later, the Vice President of the same company reaches out requesting private executive coaching specifically to defeat the CEO in an upcoming leadership shakeup. How must the coach act ethically?",options:[{letter:"أ",text:"Accept immediately because it doubles revenue and provides internal organizational intelligence.",feedback:"Dangerous violation of Standards 21 & 5. Severe conflict of interest compromising neutrality and confidentiality."},{letter:"ب",text:"Inform the CEO immediately of the VP’s intentions to protect the first client’s interests.",feedback:"Breaches confidentiality (Standard 3). Cannot disclose private inquiries to third parties."},{letter:"ج",text:"Politely decline the VP’s request explaining that an unresolvable conflict of interest prevents neutral coaching, and recommend alternative qualified coaches without disclosing any party’s secrets.",feedback:"Ethical excellence! Upholds Standards 21 & 7. Avoids conflict of interest, protects confidentiality of both, and provides referral."},{letter:"د",text:"Accept under a pseudonym and cash payments without formal invoicing.",feedback:"Fraudulent and unethical behavior."}],reference:"Code of Ethics: Standard 21 (Conflict of Interest) & Standard 3 (Confidentiality)",referenceDetail:"Coaches must avoid and disclose any actual or potential conflict of interest and withdraw when neutrality is impaired.",keyTakeaway:"Steering clear of conflicts of interest always trumps commercial gains."},10:{topic:"Cultivating Trust & Honoring Cultural Context",category:"Trust & Safety",scenario:"Discussing a major family dilemma, the client states that they always consult their elderly father and submit to his verdict out of filial piety rooted in their culture. The coach (from an individualistic culture) feels bewildered. What is the best action according to Competency 4?",options:[{letter:"أ",text:"Challenge the client and declare that parental deference at this age is a weakness of autonomy that must be abandoned immediately.",feedback:"Imposes personal cultural bias and judgment, destroying trust and safety (Indicators 4.1 & 4.2)."},{letter:"ب",text:"Honor the client’s cultural and value context, exploring how the client balances honoring their father with their personal aspirations in light of their own values.",feedback:"Exemplary ICF practice! Competency 4 requires understanding and respecting the client’s identity, background, and cultural values."},{letter:"ج",text:"Avoid any family talk altogether and restrict sessions solely to corporate matters.",feedback:"Avoidance that hinders the client from addressing holistic life realities."},{letter:"د",text:"Request the father to attend the next session so the coach can negotiate autonomy with him.",feedback:"Inappropriate boundary breach undermining the client."}],reference:"Core Competency 4: Cultivates Trust and Safety (Indicators 4.1 & 4.2)",referenceDetail:"Seeks to understand the client within their context, culture, values, and identity without imposing personal paradigms.",keyTakeaway:"Coaching centers on the client’s values and culture, never the coach’s personal convictions."},11:{topic:"Accurate Representation of Credentials",category:"Ethics & Standards",scenario:'A coach has just completed 60 hours of accredited coaching training, but has not completed required experience hours nor passed the official ICF credentialing exam. The coach creates a website styling themselves as "ICF ACC Credentialed Coach". What is the ethical status?',options:[{letter:"أ",text:"Acceptable because finishing training hours grants temporary marketing rights to use the credential.",feedback:"Incorrect. Training completion is not credentialing. Credentialing requires verified experience and passing the exam."},{letter:"ب",text:"Blatant violation of Ethical Standards 18 & 10. ICF may take disciplinary action for falsely claiming a credential not yet granted.",feedback:"Decisive and correct! Standard 18 prohibits false or misleading claims regarding ICF credentials and status."},{letter:"ج",text:"Allowed only if an asterisk note at the bottom says credentials are under review.",feedback:"Misleading representation remains prohibited under all forms."},{letter:"د",text:"Purely a marketing issue outside ICF scope as long as no client files a lawsuit.",feedback:"The Code of Ethics applies to all public representations of coaching practice."}],reference:"Code of Ethics: Standard 18 (Accurate Identification of Credentials)",referenceDetail:"Accurately and honestly identifies qualifications, training, and credential status without deception.",keyTakeaway:"Truthfulness in credential representation is the cornerstone of professional trust."},12:{topic:"Managing Personal Limitations & Professional Performance",category:"Coaching Mindset",scenario:"A coach suffers a severe sudden bereavement and emotional shock on the morning of having 4 executive sessions scheduled. The coach feels mentally scattered and unable to compose themselves. What is the ethical behavior under ICF standards?",options:[{letter:"أ",text:"Push through and attend all sessions at all costs to prove stoic professionalism and punctuality.",feedback:"Coaching while emotionally overwhelmed harms the client and violates Standard 14."},{letter:"ب",text:"Recognize personal limitations, politely apologize to clients to reschedule, or provide a qualified substitute if needed, safeguarding quality of service and presence.",feedback:"Ethical and humane excellence! Standard 14 directs coaches to recognize personal limitations and suspend work when performance is impaired."},{letter:"ج",text:"Attend the sessions and turn the dialogue toward the coach’s grief for personal catharsis.",feedback:"Gross boundary breach; coaching sessions are dedicated exclusively to the client."},{letter:"د",text:"Mute the microphone and stream recorded coaching videos for the clients.",feedback:"Unacceptable behavior breaching interactive presence."}],reference:"Code of Ethics: Standard 14 (Personal Limitations & Suspending Work)",referenceDetail:"Recognizes circumstances that impair professional performance and suspends services responsibly.",keyTakeaway:"Acknowledging human vulnerability and pausing sessions during acute crisis is peak integrity."},13:{topic:"Mid-Session Shift of Focus",category:"Agreements",scenario:'Midway through a session contracted around "Board Presentation Strategy", the client pauses and admits with agitation: "I honestly cannot think of the presentation; my mind is paralyzed by a fierce fight with my co-founder this morning!". How does an ACC coach respond under Competencies 3 & 5?',options:[{letter:"أ",text:"Insist on completing the presentation because time is fixed and the initial contract cannot be altered.",feedback:"Rigidity that violates presence (Competency 5) and client partnership."},{letter:"ب",text:'Re-contract with partnership: acknowledge what surfaced, and ask: "This seems to command your complete energy right now; would you like to shift today’s focus to address it, or stick with our original goal?".',feedback:"Ideal! Indicators 3.6 & 3.7: The coach manages time and focus in partnership and pivots flexibly when the client chooses."},{letter:"ج",text:"Dive straight into investigating the fight without acknowledging or re-contracting.",feedback:"Loses direction and deliberate client consent."},{letter:"د",text:"Terminate the session immediately and demand an extra fee for booking a new session.",feedback:"Exploitative behavior violating partnership."}],reference:"Core Competency 3 (Agreements - Indicator 3.7) & Competency 5 (Presence)",referenceDetail:"Partners with the client to manage focus, adapting direction smoothly whenever the client chooses.",keyTakeaway:"The session belongs to the client; when a vital priority emerges, re-contract with transparency and agility."},14:{topic:"Sharing Intuition & Observation with Detachment",category:"Evoking Awareness",scenario:"While listening to a client speak about their team, the coach has a strong internal intuition that the client avoids firmness out of fear of not being liked. How should the coach share this intuition according to Competency 7?",options:[{letter:"أ",text:'Assert with authority: "I am a master coach and my intuition never fails; your real problem is a childish craving for approval, stop it now".',feedback:"Gross violation! Dogmatic diagnosis violating Competencies 4, 7, and 2."},{letter:"ب",text:"Suppress the intuition completely and never share it because coaching only deals with verbatim words.",feedback:"Indicator 7.3 encourages sharing observations, intuition, and feelings without attachment."},{letter:"ج",text:'Offer it lightly with humility: "If I may, an intuition arose that could be accurate or off; I sensed a deep desire to be liked by everyone that might be creating hesitation... how does that resonate with you?".',feedback:"Benchmark ACC performance! Indicator 7.3: Shares intuition without attachment, inviting the client to explore or dismiss freely."},{letter:"د",text:'Ask the client: "Aren’t you ashamed of hesitating as a senior executive?".',feedback:"Humiliating and destructive."}],reference:"Core Competency 7: Evokes Awareness (Indicator 7.3)",referenceDetail:"Shares observations, insights, and intuition without attachment, leaving complete freedom for the client to validate or reject.",keyTakeaway:"Intuition in coaching is an invitation to explore, never a diagnosis to impose."},15:{topic:"Lavish Gifts & Professional Boundaries",category:"Ethics & Standards",scenario:"At the conclusion of a 6-month successful coaching engagement, the client (a billionaire businessman) presents you with a luxury wristwatch valued at over $15,000 and an invitation to a free holiday at their private resort. How does an ethical ICF coach proceed?",options:[{letter:"أ",text:"Accept the watch and trip immediately as a well-deserved reward for coaching success and client gratitude.",feedback:"Accepting lavish gifts compromises objectivity, independence, and boundaries (Standards 8 & 23)."},{letter:"ب",text:"Express sincere gratitude for their feelings and appreciation for their growth, while gracefully declining the lavish gift and trip, clarifying ICF ethical policies regarding strict professional boundaries.",feedback:"Stellar ethical conduct! Standards 8 & 23 urge avoiding disproportionate personal gains that compromise boundaries or integrity."},{letter:"ج",text:"Reprimand the client, accuse them of bribery, and threaten to file a police report.",feedback:"Aggressive and unprofessional overreaction lacking respect (Competency 4)."},{letter:"د",text:"Keep the watch but decline the trip to settle for a middle compromise.",feedback:"A $15,000 gift remains an excessive benefit breaching professional boundaries."}],reference:"Code of Ethics: Standard 8 (Non-exploitation) & Standard 23 (Professional Boundaries)",referenceDetail:"Maintains clear boundaries and declines lavish gifts that could impair professional independence.",keyTakeaway:"Professional boundaries protect the sanctity of the relationship and both parties’ integrity."},16:{topic:"Past Trauma (PTSD) & Coaching Boundaries",category:"Referral & Professionals",scenario:"A client books leadership coaching. Whenever conversation touches interpersonal confrontation, the client breaks into panic, severe trembling, and flashbacks of a horrific car crash from 2 years ago, stating they relive the nightmare daily. What is the ethical coach response?",options:[{letter:"أ",text:"Apply NLP or desensitization techniques to treat the crash phobia in the session.",feedback:"Extremely dangerous! A coach is not a trauma therapist. Treating PTSD without medical licensing risks re-traumatizing the client (Standards 7 & 11)."},{letter:"ب",text:"Compassionately explain that these symptoms stem from trauma requiring care from a licensed mental health professional specialized in PTSD, and suggest a referral, with the possibility of resuming leadership coaching once stabilized.",feedback:"Ideal and aligned with ICE Referral Guidelines and Standard 7. Protects psychological safety through referral."},{letter:"ج",text:"Ignore the trembling and tell the client to be tough and separate past pain from present leadership tasks.",feedback:"Inhumane and unprofessional; denies legitimate psychological trauma."},{letter:"د",text:"Offer free motivational coaching sessions to help them willpower through nightmares.",feedback:"PTSD is a clinical disorder, not a motivational slump."}],reference:"Ethics Referral Guidelines (ICE) & Standard 7 (Referrals)",referenceDetail:"Active trauma symptoms (panic attacks, flashbacks) lie outside coaching and demand immediate specialist referral.",keyTakeaway:"Coaching works with functionally healthy clients; active trauma requires therapy first."},17:{topic:"Professional Scope vs Personal Advice",category:"Trust & Safety",scenario:"During a coaching session, the client reveals agony over their eldest child’s university choice, torn between medicine and business. The coach holds a previous medical degree. What action best reflects ICF standards?",options:[{letter:"أ",text:"Use your medical background to give an elaborate lecture on the hardships of medical school vs business, advising them to steer the son toward business.",feedback:"Leveraging coach background to impose personal advice breaches partnership and neutrality."},{letter:"ب",text:"Help the client explore the family values and parenting principles they wish to rely upon to support their son in making his own independent choice, and how they wish to hold that conversation.",feedback:"Flawless! The coach does not prescribe educational paths, but empowers the client to navigate their parental role in alignment with their values."},{letter:"ج",text:"Refuse to discuss the topic and end the session because it involves the son rather than the client.",feedback:"The client’s worry as a parent is a legitimate personal coaching topic."},{letter:"د",text:"Offer a joint coaching session to persuade the son to pursue medicine.",feedback:"Directive interference violating initial coaching agreements."}],reference:"Core Competency 4 (Trust) & Competency 2 (Coaching Mindset)",referenceDetail:"Maintains the role of partner and awareness facilitator, separating personal career background from client self-determination.",keyTakeaway:"Even if the coach is a subject expert, their role is to facilitate the client’s thinking, not issue decrees."},18:{topic:"Active Listening & Managing Lengthy Storytelling",category:"Active Listening",scenario:"The client spends 15 minutes narrating minute details of a dispute between two subordinates regarding vacation schedules, repeating facts agitatedly without reaching any meaning relevant to today’s agreed leadership goal. How does an ACC coach intervene skillfully under Competencies 3, 5 & 6?",options:[{letter:"أ",text:"Remain in absolute silence for the rest of the session even if all time is exhausted, out of respect for their expression.",feedback:"Competencies 3 & 6 require the coach to manage focus and time in partnership, not let the client drown in trivia."},{letter:"ب",text:'Intervene gracefully: "Pardon the interruption; I see how complex these details are for you, but allow me to ask: how does this situation link to the core leadership goal we agreed to achieve in today’s session?".',feedback:"Exemplary bottom-lining! Re-aligns the compass gracefully, demonstrating Competency 3 (Agreement & Time Management) and Competency 6 (Listening for the Core)."},{letter:"ج",text:"Interrupt angrily reminding the client that session minutes cost money and they must stop wasting time.",feedback:"Rude and hostile, destroying psychological safety."},{letter:"د",text:"Step in as an arbitrator and decide which employee deserves the vacation.",feedback:"Assuming an external managerial role outside coaching."}],reference:"Core Competency 3 (Agreements & Time Focus) & Competency 6 (Active Listening)",referenceDetail:"Partners to manage focus and bottom-line lengthy storytelling toward underlying growth and learning.",keyTakeaway:"The coach listens to the Who, not just the What, gracefully steering focus back to the core."}};Object.assign(pr,Vg);const Cs=["أ","ب","ج","د"];let Oh=!1;function Wg(){Oh||(Oh=!0,qt.forEach(d=>{if(d.id>18||d.options.length!==4)return;const p=d.id%4;if(p===0)return;const m=new Array(4);d.options.forEach((j,E)=>{m[(E+p)%4]=j});const u={};m.forEach((j,E)=>{u[j.letter]=Cs[E]}),d.options=m.map((j,E)=>({...j,letter:Cs[E]}));const f=pr[d.id];f&&(f.options=f.options.map(j=>({...j,letter:u[j.letter]})).sort((j,E)=>Cs.indexOf(j.letter)-Cs.indexOf(E.letter)))}))}Wg();function Rs(d,p){const m=pr[d.id];return p==="en"&&m?{topic:m.topic,category:m.category,scenario:m.scenario,options:m.options.map(u=>({letter:u.letter,displayLetter:zs(u.letter,"en"),text:u.text,feedback:u.feedback})),reference:m.reference,referenceDetail:m.referenceDetail,keyTakeaway:m.keyTakeaway}:{topic:d.topic,category:d.category,scenario:d.scenario,options:d.options.map(u=>({letter:u.letter,displayLetter:u.letter,text:u.text,feedback:u.feedback})),reference:d.reference,referenceDetail:d.referenceDetail,keyTakeaway:d.keyTakeaway}}const Kg={1:{groupName:"Foundation",shortDesc:"Understands and consistently applies coaching ethics and standards with full integrity.",fullExplanation:"This competency defines the coach’s full commitment to the ICF Code of Ethics and its core values (Integrity, Excellence, Collaboration, Respect). It requires unwavering protection of client confidentiality, a clear distinction between coaching, consulting and psychotherapy, acting with honesty, and referring to other professionals when needed.",practicalApplication:"When contracting, clarify the limits of confidentiality (e.g., risk of self-harm or explicit legal violations) and define the roles of the Sponsor and the Client. Do not give advice, psychological diagnoses, or ready-made solutions.",realWorldScenario:"In the fourth session, a client reveals severe anxiety and depression that have prevented sleep and work for two months, and asks for “secret therapy” without informing the sponsoring manager. Ethical response: acknowledge the feelings with care, clarify that coaching is not therapy, and refer to a mental-health professional while pausing or adapting coaching.",exploratoryQuestion:"How do you make sure the client and sponsor fully understand the difference between coaching, therapy and consulting before any session begins?",behavioralIndicators:["Demonstrates personal integrity and honesty in interactions with clients, sponsors and stakeholders.","Is sensitive to clients’ identity, environment, experiences, values and beliefs.","Uses language appropriate and respectful to clients, sponsors and stakeholders.","Abides by the ICF Code of Ethics and upholds the Core Values.","Maintains confidentiality with client information per stakeholder agreements and pertinent laws.","Maintains the distinctions between coaching, consulting, psychotherapy and other support professions.","Refers clients to other support professionals, as appropriate."],accExamFocus:"In the ACC exam, if the client shows clinical symptoms or asks for consulting solutions, the correct choice is always to clarify the coaching scope, explore referral, or uphold confidentiality toward the sponsor."},2:{groupName:"Foundation",shortDesc:"Develops and maintains a mindset that is open, curious, flexible and client-centered.",fullExplanation:"This competency requires the coach to believe the client is the expert in their own life and fully responsible for their choices and results. It includes ongoing reflective practice, accepting that the coach does not hold the answers, comfort with “not knowing”, emotional self-regulation and self-awareness.",practicalApplication:"Clear your mind of personal concerns before the session. When the client asks “What would you do in my place?”, do not answer from your personal experience; invite them to explore their own options neutrally.",realWorldScenario:"A client is torn between a new job offer and staying in their current role and asks: “You are a management expert, what is the right decision for me?”. Instead of analyzing, the coach asks: “I sense you are looking for certainty; which criteria matter most to your values and future vision as we weigh the options?”.",exploratoryQuestion:"What reflective practices do you follow after each session to make sure you did not impose your ideas or biases on the client?",behavioralIndicators:["Acknowledges that clients are responsible for their own choices.","Engages in ongoing learning and development as a coach.","Develops an ongoing reflective practice to enhance one’s coaching.","Remains open, curious and comfortable with “not knowing”.","Remains aware of and open to the influence of context and culture on self and others.","Uses awareness of self and one’s intuition to benefit clients.","Develops and maintains the ability to regulate one’s emotions."],accExamFocus:"The ACC exam tests whether the coach lets go of the urge to “fix” the client’s problem and instead supports the client in finding their own solutions."},3:{groupName:"Co-Creating the Relationship",shortDesc:"Partners with the client and stakeholders to create clear agreements about the relationship, process, plans and goals.",fullExplanation:"This competency has two dimensions: the overall coaching agreement (coach, client and sponsor) and the agreement for each individual session. In every session the coach partners with the client to define what they want to achieve today, why it matters now, how success will be measured, and what needs to be addressed to get there.",practicalApplication:"Do not dive into story details before agreeing on the session goal. Always ask: “What tangible outcome would you like by the end of our time today, and how will you know we achieved it?”.",realWorldScenario:"A client spends ten minutes describing problems with their boss, colleagues and spouse. Interrupting with solutions is wrong. Applying Competency 3, the coach reflects the topics and asks: “You mentioned several connected and important areas; where would you like to start today so our focus is most valuable to you?”.",exploratoryQuestion:"How do you redirect the session gracefully and in partnership when the client drifts far from the goal agreed at the start?",behavioralIndicators:["Explains what coaching is and is not, and describes the process to the client and stakeholders.","Reaches agreement about the goals of the overall engagement and how they will be measured.","Partners with the client to identify what they want to accomplish in the session.","Partners with the client to define measures of success for the session.","Partners with the client to identify what they need to address to achieve the outcome.","Partners with the client to manage time and focus of the session.","Continues coaching in the direction of the desired outcome unless the client indicates otherwise."],accExamFocus:"Agreement questions in the ACC check that the client sets the goal and success measure, and that the coach checks alignment during the session without imposing an agenda."},4:{groupName:"Co-Creating the Relationship",shortDesc:"Partners with the client to create a safe, supportive environment that allows the client to share freely.",fullExplanation:"Building a judgment-free environment where the client feels completely safe to be vulnerable, authentic and honest. It includes respecting the client’s identity and culture, showing empathy and unconditional support, acknowledging the client’s experiences and achievements, and the coach openly acknowledging their own humanity.",practicalApplication:"Show warm, respectful presence. When the client expresses fear or failure, do not minimize it with phrases like “don’t worry, it will pass”; acknowledge the weight of the situation and honor their courage in sharing.",realWorldScenario:"A client suddenly cries, admitting they feel like a total failure as a leader after a key employee resigned. The right response: a few seconds of silence to honor the emotion, acknowledging their courage, and reaffirming the safe space without shallow comfort or instant advice.",exploratoryQuestion:"What subtle signals in your body language and tone build psychological safety for the client in difficult moments?",behavioralIndicators:["Seeks to understand the client within their context, including identity, environment, experiences, values and beliefs.","Demonstrates respect for the client’s identity, perceptions, style and language.","Acknowledges and respects the client’s unique talents, insights and work.","Shows support, empathy and concern for the client.","Acknowledges and supports the client’s expression of feelings, perceptions, concerns and beliefs.","Demonstrates openness and transparency as a way to display vulnerability and build trust."],accExamFocus:"Any option containing hidden judgment, rushing past the client’s emotions, or ignoring their cultural context is wrong in the ACC."},5:{groupName:"Co-Creating the Relationship",shortDesc:"Is fully conscious and present with the client, employing a style that is open, flexible, grounded and confident.",fullExplanation:"The ability to stay in the “here and now” without being preoccupied with the next question or technique. It includes flexibility in following the flow of the session, managing uncertainty calmly, and using silence as a powerful tool that lets the client process and reach deep insight.",practicalApplication:"When the client raises a surprising idea that shifts direction, do not cling to your plan; follow the client and explore flexibly. Practice pausing for a few seconds after the client answers to allow deeper reflection.",realWorldScenario:"The coach asks a deep question and the client goes silent, gazing ahead for 15 seconds. A beginner breaks the silence out of discomfort. A professional ICF coach holds calm, encouraging presence until the client gathers their insight and speaks.",exploratoryQuestion:"What happens inside you during long silences in a session, and how do you manage the urge to fill the space?",behavioralIndicators:["Remains focused, observant, empathetic and responsive to the client.","Demonstrates curiosity during the coaching process.","Manages one’s emotions to stay present with the client.","Demonstrates confidence in working with strong client emotions.","Is comfortable working in a space of not knowing.","Creates or allows space for silence, pause or reflection."],accExamFocus:"In the ACC, effective silence and adapting to the client in the moment outweigh rapid-fire questions or sticking to the agenda."},6:{groupName:"Communicating Effectively",shortDesc:"Focuses on what the client is and is not saying to fully understand what is being communicated in context.",fullExplanation:"Listening on three levels: the words, the emotions/tone/body language, and the deep meaning and identity context of the client. The coach uses the client’s own words without distorting paraphrase and gently notices incongruence between words, actions or tone.",practicalApplication:"Use the client’s exact words (e.g., “a mountain sitting on my chest”) rather than replacing them with your own. Notice shifts in energy and tone when they talk about certain people or situations and reflect them neutrally.",realWorldScenario:"With a forced smile and low voice, the client says: “I’m very happy with the new promotion, it’s great!”. The coach notices the mismatch and reflects: “I hear you say you are happy, yet your voice sounded quiet and heavy; what is really going on inside you about this promotion?”.",exploratoryQuestion:"How do you distinguish between hearing the external details of the story and listening to the client’s beliefs and self-perception?",behavioralIndicators:["Considers the client’s context, identity, environment, experiences, values and beliefs.","Reflects or summarizes what the client communicated to ensure clarity and understanding.","Recognizes and inquires when there is more to what the client is communicating.","Notices, acknowledges and explores the client’s emotions, energy shifts and non-verbal cues.","Integrates the client’s words, tone of voice and body language.","Notices trends in the client’s behaviors and emotions across sessions to discern themes and patterns."],accExamFocus:"Active listening is not parroting; it is grasping underlying feelings and gently exploring incongruence without interrogation."},7:{groupName:"Communicating Effectively",shortDesc:"Facilitates client insight and learning using powerful questioning, silence, metaphor or analogy.",fullExplanation:"Helping the client see beyond current thinking and explore limiting assumptions and unconscious beliefs. This is done through short, open, exploratory questions, metaphors and analogies, sharing observations and intuition without attachment, and respectfully challenging the client to expand awareness.",practicalApplication:"Avoid leading, interrogative questions (e.g., “Haven’t you thought of talking to your manager?”) and use genuinely open, thought-provoking questions (e.g., “What assumption is this hesitation built on?”).",realWorldScenario:"The client says: “I’m trapped in a corner with no choice but to give up”. The coach asks: “If you stood on a high mountain looking down at this corner, what wider landscape might you see that you haven’t noticed yet?”.",exploratoryQuestion:"What is your criterion for a question that truly evokes awareness versus one that merely gathers information out of curiosity?",behavioralIndicators:["Considers client experience when deciding what might be most useful.","Challenges the client as a way to evoke awareness or insight.","Asks questions about the client — their way of thinking, values, needs, wants and beliefs.","Asks questions that help the client explore beyond current thinking.","Invites the client to share more about their experience in the moment.","Shares observations, insights and feelings, without attachment, that may create new learning."],accExamFocus:"In the ACC exam, powerful questions are always open (what, how), start from the client’s words and target their thinking pattern rather than collecting dramatic details."},8:{groupName:"Cultivating Learning and Growth",shortDesc:"Partners with the client to transform learning and insight into action and promote autonomy.",fullExplanation:"The ultimate aim of a coaching session is for the client to turn new awareness into practical steps, decisions and sustainable growth. This includes helping the client design an actionable plan, identify resources and potential obstacles, decide how to hold themselves accountable, and celebrate progress.",practicalApplication:"In the last part of the session ask: “With this new awareness, what concrete first step will you take? When will you start? How will you keep your commitment?”. Let the client design the whole plan.",realWorldScenario:"After discovering why they procrastinate on an important project, near the end of the session the coach asks rather than proposing a timeline: “What action do you feel most energized to take before our next meeting, and who or what could support you?”.",exploratoryQuestion:"How do you support the client in designing their own accountability system without becoming the supervisor or teacher?",behavioralIndicators:["Works with the client to integrate new awareness, insight or learning into their worldview and behaviors.","Partners with the client to design goals, actions and accountability measures.","Acknowledges and supports client autonomy in the design of goals and actions.","Supports the client in identifying potential results or learning from identified action steps.","Invites the client to consider how to move forward, including resources, support and potential barriers.","Partners with the client to summarize learning and insight within or between sessions.","Celebrates the client’s progress and successes, and closes the session in partnership."],accExamFocus:"The coach never assigns homework! The client designs their own actions, steps and way of holding themselves accountable."}},$g={G:{definition:"Clearly defining what the client wants to achieve in the session and in the long term — specific and tangible.",coachRole:"Helps the client articulate a positive, realistic and inspiring goal they fully own, and clarifies how success will be measured by the end of the session.",sampleQuestions:["What would you like to achieve by the end of our session today?","What will success look like for you, and how will you know you got there?","What positive impact will reaching this goal have on your life or work?","Which specific part of this challenge would you like to focus on now?"],practicalTips:"Make sure the goal comes from the client’s own will, not their boss or family, and that the session time realistically fits the depth of the goal."},R:{definition:"Exploring the current situation objectively and identifying challenges, emotions and context.",coachRole:"Listens deeply without judgment and evokes awareness of assumptions and blocking patterns without drowning the session in historical details.",sampleQuestions:["Where exactly do you stand right now in relation to this goal?","What have you tried so far, and what result did you get?","What are the real obstacles you feel are in your way?","What are you afraid of, or what makes you hesitate to move forward?"],practicalTips:"Don’t let the client complain or make lengthy excuses; gently steer the conversation toward their self-awareness and responsibility in the present."},O:{definition:"Brainstorming multiple, fresh options and alternatives to reach the desired goal.",coachRole:"Encourages out-of-the-box thinking, removes mental limits (“What if anything were possible?”) and refrains from offering their own solutions.",sampleQuestions:["What options do you have available to act right now?","If all fears and obstacles disappeared, what would you do immediately?","What would someone whose wisdom and courage you trust do in your place?","What is the boldest option that just came to your mind?"],practicalTips:"Encourage the client to reach at least 4–5 options before evaluating, and don’t criticize any idea during generation."},W:{definition:"Turning options into real commitment and a concrete action plan with steps, dates and clear self-accountability.",coachRole:"Supports the client in deciding what they will do, when they will start, their commitment level from 1 to 10, and how they will handle potential obstacles.",sampleQuestions:["Of all the options we discussed, which one will you commit to?","What is your first concrete step, and exactly when will you take it?","On a scale of 1–10, how committed are you to this step? (If below 8: what would make it a 9 or 10?)","What obstacle might you face, how will you overcome it, and how will you celebrate success?"],practicalTips:"The coach must not act as supervisor or teacher; let the client choose their support partner or way of tracking progress."}},Fg={1:{title:"Explaining the nature of coaching and confidentiality",practical:"Hold a discovery/chemistry call and sign a clear contract stating coaching is not therapy or consulting.",pitfall:"Starting sessions without clarifying confidentiality limits and legal disclosure exceptions."},2:{title:"Clear agreement with client and sponsor",practical:"Distinguish the client (receives coaching) from the sponsor (pays), and define how general progress is reported without session details.",pitfall:"Letting the sponsor request detailed reports about the client’s feelings or secrets without written consent."},3:{title:"Strict confidentiality and legal exceptions",practical:"Keep notes encrypted and never discuss clients in supervision with identifying information.",pitfall:"Sharing session stories on social media whose unique details reveal the client’s identity."},4:{title:"Clarity on information exchange",practical:"Agree in advance that the sponsor only receives attendance and general themes, with the client’s approval.",pitfall:"Answering a manager’s casual phone questions about what the employee said in session."},5:{title:"Managing multiple roles and conflicts",practical:"Applies when an internal coach also holds an HR or managerial role in the organization.",pitfall:"Mixing performance evaluation with neutral, supportive coaching of the same employee."},6:{title:"Right to terminate the relationship",practical:"If the client feels they no longer benefit, the coach welcomes the decision without pressure or guilt.",pitfall:"Pushing the client to continue because goals are “not yet complete”."},7:{title:"Ethical referral to other professionals",practical:"Noticing signs of clinical depression, PTSD, or a need for purely legal/financial advice.",pitfall:"Trying to act as a therapist out of empathy or over-eagerness."},8:{title:"No financial, emotional or physical exploitation",practical:"Never use a client’s confidential business information for personal investment gain.",pitfall:"Asking the client for investments or free services during the engagement."},9:{title:"No romantic or sexual relationships",practical:"Keep strict boundaries and withdraw immediately if romantic feelings affect neutrality.",pitfall:"Continuing sessions despite personal attraction or romantic hints."},10:{title:"No misleading claims about outcomes",practical:"Never guarantee things like “an executive promotion or 300% profit in two months”.",pitfall:"Exaggerated marketing promising to solve life and money problems overnight."},11:{title:"No advice outside one’s competence",practical:"Refrain from tax,
