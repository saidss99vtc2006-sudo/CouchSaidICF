whitespace-nowrap shrink-0 transition-all ${d===X.id?"bg-amber-500 text-slate-950 shadow-md shadow-amber-500/25":X.id==="feedback"?"text-amber-700 bg-amber-500/10 border border-amber-500/30 hover:bg-amber-500/20":"text-slate-600 bg-slate-100/60 hover:text-slate-900 hover:bg-slate-100"}`,children:[X.icon,X.label]},X.id))})]})})},Om=["أ","ب","ج","د"],qm=[{id:19,comp:3,std:0,diff:"متوسط",cat:"الاتفاقيات",catEn:"Agreements",topic:["عميل بلا هدف واضح للجلسة","Client with no clear session goal"],scenario:['يبدأ العميل الجلسة قائلاً: "ليس لدي موضوع محدد اليوم، أريد فقط أن أتحدث". ما التصرف الأنسب للكوتش وفق الجدارة 3؟','The client opens the session saying: "I don’t have a specific topic today, I just want to talk." What is the most appropriate response under Competency 3?'],correct:2,options:[["يقترح الكوتش موضوعاً من الجلسة السابقة ويبدأ العمل عليه مباشرة.","The coach proposes a topic from the previous session and starts working on it immediately.","غير صحيح. اختيار الموضوع نيابة عن العميل يفرض أجندة الكوتش ويخالف الشراكة.","Incorrect. Choosing the topic for the client imposes the coach’s agenda and breaks partnership."],["يترك العميل يتحدث بحرية طوال الجلسة دون أي اتفاق.","Let the client talk freely for the whole session without any agreement.","غير صحيح. غياب الاتفاق يحوّل الجلسة إلى دردشة بلا نتيجة ويهمل الجدارة 3.","Incorrect. Without an agreement the session becomes a chat with no outcome, neglecting Competency 3."],['يرحب بذلك ويستكشف مع العميل: "ما الذي يجعل حديثنا اليوم ذا قيمة لك؟ وكيف ستعرف في النهاية أنه كان مفيداً؟".','Welcome it and explore with the client: "What would make our conversation valuable for you today, and how will you know at the end that it was useful?"',"صحيح. الكوتش يحترم رغبة العميل ويشاركه في بلورة نتيجة ومعيار نجاح للجلسة (المؤشرات 3.3 و3.4).","Correct. The coach honors the client’s wish while partnering to shape an outcome and success measure (indicators 3.3 & 3.4)."],["يعتذر عن الجلسة لأن الكوتشينج يتطلب هدفاً محدداً مسبقاً.","Cancel the session because coaching requires a predefined goal.","غير صحيح. هذا تصرف جامد؛ دور الكوتش مساعدة العميل على اكتشاف ما يريده.","Incorrect. Too rigid; the coach’s role is to help the client discover what they want."]],ref:["الجدارة 3: تأسيس الاتفاقيات والحفاظ عليها","Competency 3: Establishes and Maintains Agreements"],detail:["يشارك الكوتش العميل في تحديد ما يريد إنجازه في الجلسة ومعايير النجاح.","The coach partners with the client to identify what they want to accomplish and how success will be measured."],take:['حتى "أريد أن أتحدث فقط" يمكن أن تصبح اتفاقية جلسة واضحة بالأسئلة المناسبة.','Even "I just want to talk" can become a clear session agreement with the right questions.']},{id:20,comp:3,std:2,diff:"صعب",cat:"الاتفاقيات",catEn:"Agreements",topic:["تعارض هدف الراعي مع هدف العميل","Sponsor goal vs. client goal"],scenario:["تعاقدت شركة معك لتطوير مهارات إدارة الوقت لدى أحد موظفيها. في الجلسة الثالثة يقول العميل إنه يريد العمل على خطة لترك الشركة وبدء مشروعه الخاص. ما التصرف الأخلاقي والمهني الأنسب؟","A company contracted you to develop an employee’s time-management skills. In session three the client says he wants to work on a plan to leave the company and start his own business. What is the most ethical and professional response?"],correct:1,options:[["يبلغ الكوتش الشركة الراعية فوراً بنية الموظف حفاظاً على حقها.","Inform the sponsoring company immediately of the employee’s intention to protect its interests.","غير صحيح. هذا خرق صريح للسرية (المعيار 3).","Incorrect. A direct breach of confidentiality (Standard 3)."],["يعترف بما طرحه العميل، ويوضح معه بنود الاتفاق الثلاثي مع الراعي، ويستكشف كيف يريد التعامل مع ذلك، مع إمكانية مراجعة الاتفاق بشفافية وبموافقة العميل.","Acknowledge what the client raised, clarify the three-party agreement together, explore how he wants to handle it, and revisit the agreement transparently with his consent.","صحيح. يحافظ على السرية ويحترم أدوار جميع الأطراف ويعيد التعاقد بوضوح (المعايير 2 و3 و4).","Correct. Protects confidentiality, respects all parties’ roles and re-contracts clearly (Standards 2, 3 & 4)."],["يرفض الحديث عن الموضوع ويُلزم العميل بهدف إدارة الوقت فقط.","Refuse to discuss it and force the client to stick to time management only.","غير صحيح. يتجاهل ما يهم العميل حالياً ويضر بالثقة والأمان.","Incorrect. Ignores what matters to the client now and damages trust and safety."],['يعمل سراً مع العميل على خطة الاستقالة ويستمر في إرسال تقارير "إدارة الوقت" للشركة.','Secretly work with the client on his resignation plan while continuing to send "time-management" reports to the company.',"غير صحيح. هذا خداع للراعي ويخالف النزاهة ووضوح الاتفاقيات.","Incorrect. This deceives the sponsor and violates integrity and clarity of agreements."]],ref:["مدونة الأخلاقيات: المعايير 2 و3 و4","Code of Ethics: Standards 2, 3 & 4"],detail:["يحدد الاتفاق أدوار ومسؤوليات وحقوق جميع الأطراف، مع الحفاظ على سرية العميل.","Agreements define roles, responsibilities and rights of all parties while protecting client confidentiality."],take:["عند تعارض الأهداف: لا خرق للسرية، ولا خداع للراعي، بل إعادة تعاقد بشفافية.","When goals conflict: no breach of confidentiality, no deceiving the sponsor — re-contract transparently."]},{id:21,comp:2,std:0,diff:"متوسط",cat:"عقلية الكوتشينج",catEn:"Coaching Mindset",topic:["رأي الكوتش الشخصي في قرار العميل","Coach’s personal opinion on a client decision"],scenario:["يخبرك العميل أنه قرر ترك وظيفة حكومية مستقرة ليبدأ مشروعاً ناشئاً. تشعر داخلياً أن القرار متهور. ماذا تفعل؟","The client tells you he has decided to leave a stable government job to start a startup. Internally you feel the decision is reckless. What do you do?"],correct:3,options:[["يحذره بلطف من المخاطر بناءً على خبرتك.","Gently warn him about the risks based on your experience.","غير صحيح. هذا إسقاط لرأي الكوتش وتحول إلى دور الناصح.","Incorrect. This projects the coach’s opinion and shifts into advising."],["يشاركه قصة فشل مشروعك السابق ليعيد التفكير.","Share the story of your own failed startup so he reconsiders.","غير صحيح. يوجّه العميل عبر تجربة الكوتش الشخصية بدل استكشاف تجربته هو.","Incorrect. Steers the client with the coach’s personal story instead of exploring his own."],['يطرح أسئلة موجهة مثل: "ألا تخاف أن تخسر كل شيء؟".','Ask leading questions like: "Aren’t you afraid of losing everything?"',"غير صحيح. السؤال الموجه يحمل حكماً مبطناً ويقود العميل لنتيجة يريدها الكوتش.","Incorrect. Leading questions carry hidden judgment and push the client toward the coach’s preferred answer."],["يلاحظ ردة فعله الداخلية ويضعها جانباً، ويبقى فضولياً لاستكشاف ما يعنيه القرار للعميل وكيف يراه.","Notice your inner reaction, set it aside, and stay curious about what the decision means to the client and how he sees it.","صحيح. الوعي الذاتي وتنظيم المشاعر والإيمان بأن العميل مسؤول عن خياراته (الجدارة 2).","Correct. Self-awareness, emotional regulation and trusting the client’s responsibility for his choices (Competency 2)."]],ref:["الجدارة 2: تجسيد عقلية الكوتشينج","Competency 2: Embodies a Coaching Mindset"],detail:["يدرك الكوتش أن العميل مسؤول عن خياراته، ويستخدم وعيه الذاتي لصالح العميل.","The coach acknowledges the client is responsible for his choices and uses self-awareness to benefit the client."],take:["رأيك الشخصي ليس دليلاً للعميل؛ فضولك هو الأداة.","Your personal opinion is not the client’s compass — your curiosity is the tool."]},{id:22,comp:2,std:13,diff:"صعب",cat:"عقلية الكوتشينج",catEn:"Coaching Mindset",topic:["الممارسة التأملية بعد الجلسة","Reflective practice after a session"],scenario:["بعد مراجعة تسجيل جلستك (بموافقة العميل)، اكتشفت أنك تحدثت نحو 60% من الوقت وقدمت عدة اقتراحات. ما الخطوة الأنسب؟","After reviewing your session recording (with client consent), you discover you spoke about 60% of the time and offered several suggestions. What is the best next step?"],correct:0,options:[["يمارس التأمل الذاتي لفهم ما دفعه لذلك، ويطلب تغذية راجعة من مُرشِد كوتشينج (Mentor Coach)، ويضع نية واضحة لتحسين حضوره.","Reflect on what drove this, seek feedback from a mentor coach, and set a clear intention to improve.","صحيح. الممارسة التأملية والتطوير المستمر جوهر الجدارة 2 والمعيار 13.","Correct. Reflective practice and continuous development are at the heart of Competency 2 and Standard 13."],["لا مشكلة؛ العميل يدفع مقابل خبرة الكوتش لذلك من الطبيعي أن يتحدث أكثر.","No problem; the client pays for the coach’s expertise, so talking more is natural.","غير صحيح. الكوتشينج يركز على تفكير العميل، لا على خبرة الكوتش.","Incorrect. Coaching centers on the client’s thinking, not the coach’s expertise."],["يعتذر للعميل ويعطيه جلسات مجانية تعويضاً.","Apologize to the client and give free sessions as compensation.","غير دقيق. التعويض لا يعالج السبب؛ المطلوب هو التأمل والتطوير المهني.","Not accurate. Compensation doesn’t address the cause; reflection and development do."],["يحذف التسجيل ويتجاهل الأمر.","Delete the recording and ignore it.","غير صحيح. تجاهل التعلم يناقض الممارسة التأملية.","Incorrect. Ignoring the learning contradicts reflective practice."]],ref:["الجدارة 2 والمعيار الأخلاقي 13","Competency 2 & Ethical Standard 13"],detail:["يطور الكوتش ممارسة تأملية مستمرة ويلتزم بالتطوير المهني.","The coach develops ongoing reflective practice and commits to professional development."],take:["قاعدة ذهبية: العميل يتحدث معظم الوقت، والكوتش يسأل ويعكس.","Golden rule: the client talks most of the time; the coach asks and reflects."]},{id:23,comp:4,std:0,diff:"متوسط",cat:"الثقة والأمان",catEn:"Trust & Safety",topic:["اعتراف العميل بخطأ يخجل منه","Client admits a mistake he is ashamed of"],scenario:['يعترف العميل بصوت منخفض: "صرخت على فريقي أمس أمام الجميع، وأشعر بالخجل". كيف يستجيب الكوتش؟','The client admits quietly: "I yelled at my team yesterday in front of everyone, and I feel ashamed." How does the coach respond?'],correct:1,options:[['"هذا سلوك غير مقبول من قائد، يجب أن تعتذر فوراً".','"That’s unacceptable behavior for a leader; you must apologize immediately."',"غير صحيح. حكم وتوجيه يهدم الأمان النفسي.","Incorrect. Judgment and directive that destroy psychological safety."],["يقدّر شجاعته في المشاركة ويعترف بمشاعره دون حكم، ثم يستكشف معه ما يريد أن يفعله بهذا الموقف.","Appreciate his courage in sharing, acknowledge his feelings without judgment, then explore what he wants to do about it.","صحيح. دعم التعبير عن المشاعر دون حكم وإظهار التعاطف (الجدارة 4).","Correct. Supports expression of feelings without judgment and shows empathy (Competency 4)."],['"لا تقلق، كلنا نفعل ذلك أحياناً، انسَ الأمر".','"Don’t worry, we all do that sometimes — forget it."',"غير صحيح. التقليل من المشاعر يمنع التعلم والنمو.","Incorrect. Minimizing feelings blocks learning and growth."],["يعطيه فوراً ثلاث تقنيات لإدارة الغضب.","Immediately give him three anger-management techniques.","غير صحيح. قفز إلى الحلول وتحول لدور المدرب.","Incorrect. Jumps to solutions and shifts into a trainer role."]],ref:["الجدارة 4: تنمية الثقة والأمان","Competency 4: Cultivates Trust and Safety"],detail:["يدعم الكوتش تعبير العميل عن مشاعره ومخاوفه دون حكم.","The coach supports the client’s expression of feelings and concerns without judgment."],take:["الأمان النفسي يسبق أي تعلم.","Psychological safety comes before any learning."]},{id:24,comp:4,std:0,diff:"صعب",cat:"الثقة والأمان",catEn:"Trust & Safety",topic:["خطأ من الكوتش نفسه","A mistake by the coach"],scenario:["تأخرت 15 دقيقة عن جلسة عبر الإنترنت بسبب سوء تنظيم منك. العميل ينتظر وتبدو عليه علامات الانزعاج. ما التصرف الأنسب؟","You were 15 minutes late to an online session due to your own poor planning. The client is waiting and looks annoyed. What is best?"],correct:3,options:[["يلقي اللوم على مشكلة تقنية في الإنترنت.","Blame a technical internet problem.","غير صحيح. الكذب يناقض النزاهة ويهدم الثقة.","Incorrect. Lying contradicts integrity and destroys trust."],["يبدأ الجلسة مباشرة وكأن شيئاً لم يحدث.","Start the session right away as if nothing happened.","غير صحيح. تجاهل مشاعر العميل وخطأ الكوتش يضعف الثقة.","Incorrect. Ignoring the client’s feelings and the coach’s mistake weakens trust."],["يختصر الجلسة دون إبلاغ العميل بالوقت المتبقي.","Shorten the session without telling the client about the remaining time.","غير صحيح. يخالف الشفافية وإدارة الوقت بشراكة.","Incorrect. Violates transparency and partnering on time management."],["يعترف بخطئه بشفافية ويعتذر، ويتفق مع العميل على تعويض الوقت وفق الاتفاقية.","Own the mistake transparently, apologize, and agree with the client on making up the time per the agreement.","صحيح. الانفتاح والشفافية والاعتراف بالخطأ يبني الثقة (المؤشر 4.6).","Correct. Openness, transparency and owning mistakes build trust (indicator 4.6)."]],ref:["الجدارة 4 (المؤشر 4.6) والمعيار 1","Competency 4 (indicator 4.6) & Standard 1"],detail:["يُظهر الكوتش الانفتاح والشفافية كوسيلة لبناء الثقة.","The coach demonstrates openness and transparency as a way to build trust."],take:["اعترافك بخطئك نموذج للعميل وليس ضعفاً.","Owning your mistake models integrity — it is not weakness."]},{id:25,comp:5,std:0,diff:"متوسط",cat:"الحضور",catEn:"Presence",topic:["انفعال قوي من العميل","Strong client emotion"],scenario:["أثناء الحديث عن زميل في العمل، يرفع العميل صوته بغضب ويضرب الطاولة. ما الاستجابة الأنسب؟","While talking about a colleague, the client raises his voice angrily and hits the table. What is the best response?"],correct:0,options:[["يبقى هادئاً ومتزناً، ويتيح مساحة للمشاعر، ثم يستكشف بفضول ما الذي يحدث بداخل العميل الآن.","Stay calm and grounded, allow space for the emotion, then curiously explore what is happening inside the client now.","صحيح. الثقة في التعامل مع المشاعر القوية والبقاء حاضراً (المؤشر 5.4).","Correct. Confidence working with strong emotions and staying present (indicator 5.4)."],["يطلب منه أن يهدأ ثم ينتقل لموضوع آخر بسرعة.","Ask him to calm down and quickly move to another topic.","غير صحيح. الهروب من المشاعر يعكس عدم ارتياح الكوتش.","Incorrect. Escaping emotions reflects the coach’s discomfort."],["يوافقه أن زميله مخطئ تماماً لتهدئته.","Agree that the colleague is completely wrong to calm him down.","غير صحيح. الانحياز يفقد الكوتش حياده.","Incorrect. Taking sides loses the coach’s neutrality."],["ينهي الجلسة فوراً.","End the session immediately.","غير صحيح. الغضب وحده لا يستدعي إنهاء الجلسة ما لم يكن هناك خطر.","Incorrect. Anger alone doesn’t require ending the session unless there is danger."]],ref:["الجدارة 5: الحفاظ على الحضور","Competency 5: Maintains Presence"],detail:["يُظهر الكوتش الثقة في العمل مع المشاعر القوية للعميل.","The coach demonstrates confidence in working with strong client emotions."],take:["المشاعر القوية ليست تهديداً؛ إنها بوابة للوعي.","Strong emotions aren’t a threat — they are a doorway to awareness."]},{id:26,comp:5,std:0,diff:"صعب",cat:"الحضور",catEn:"Presence",topic:["تشتت الكوتش أثناء الجلسة","Coach distracted mid-session"],scenario:["أثناء حديث العميل، شرد ذهنك لثوانٍ بسبب رسالة شخصية، وفاتك جزء مما قاله. ما التصرف الأنسب؟","While the client was speaking, your mind wandered for a few seconds because of a personal message and you missed part of what he said. What is best?"],correct:2,options:[["يتظاهر بالفهم ويواصل بسؤال عام.","Pretend to understand and continue with a generic question.","غير صحيح. يفقد الكوتش الدقة والصدق.","Incorrect. The coach loses accuracy and honesty."],["يلخص ما يظنه قاله العميل دون التحقق.","Summarize what he thinks the client said without checking.","غير صحيح. قد يحرف المعنى ويعتمد على الافتراض.","Incorrect. May distort meaning and rely on assumptions."],["يعيد تركيزه فوراً، ويطلب من العميل بصدق إعادة الجزء الأخير ليتأكد من فهمه.","Refocus immediately and honestly ask the client to repeat the last part to make sure he understands.","صحيح. إدارة الكوتش لنفسه ليبقى حاضراً، مع الشفافية (المؤشر 5.3).","Correct. The coach manages himself to stay present, with transparency (indicator 5.3)."],["يستمر في قراءة الرسالة لأنها قد تكون مهمة.","Keep reading the message because it might be important.","غير صحيح. يخل بالحضور الكامل مع العميل.","Incorrect. Breaks full presence with the client."]],ref:["الجدارة 5 (المؤشرات 5.1 و5.3)","Competency 5 (indicators 5.1 & 5.3)"],detail:["يدير الكوتش مشاعره وانتباهه ليبقى حاضراً مع العميل.","The coach manages emotions and attention to stay present with the client."],take:["الصدق في لحظة التشتت أفضل من التظاهر بالحضور.","Honesty in a moment of distraction beats pretending to be present."]},{id:27,comp:6,std:0,diff:"متوسط",cat:"الاستماع النشط",catEn:"Active Listening",topic:["نمط لغوي متكرر","Repeated language pattern"],scenario:['يكرر العميل خلال الجلسة: "يجب أن أكون أقوى"، "يجب أن أنجز أكثر"، "يجب ألا أتعب". ما أفضل استجابة؟','Throughout the session the client repeats: "I should be stronger", "I should achieve more", "I shouldn’t get tired". What is the best response?'],correct:3,options:[["يتجاهل الكلمة لأنها تفصيل لغوي.","Ignore the word since it’s just a language detail.","غير صحيح. يفوّت نمطاً مهماً في تفكير العميل.","Incorrect. Misses an important pattern in the client’s thinking."],['يطلب منه التوقف عن قول "يجب" لأنها سلبية.','Ask him to stop saying "should" because it’s negative.',"غير صحيح. توجيه وتصحيح بدلاً من الاستكشاف.","Incorrect. Directing and correcting instead of exploring."],["يعطيه محاضرة قصيرة عن قوة اللغة الإيجابية.","Give him a short lecture on the power of positive language.","غير صحيح. تحول لدور المعلم.","Incorrect. Shifts into a teaching role."],['يعكس النمط: "لاحظت أنك قلت (يجب) عدة مرات؛ ماذا تعني لك هذه الكلمة؟ ومن أين تأتي؟".','Reflect the pattern: "I noticed you said ‘should’ several times — what does that word mean to you, and where does it come from?"',"صحيح. يلاحظ الأنماط ويستخدم كلمات العميل ويستكشفها (المؤشر 6.6).","Correct. Notices patterns, uses the client’s words and explores them (indicator 6.6)."]],ref:["الجدارة 6: الاستماع النشط","Competency 6: Listens Actively"],detail:["يلاحظ الكوتش اتجاهات سلوك العميل ومشاعره لتمييز الأنماط.","The coach notices trends in client behavior and emotions to discern patterns."],take:["الكلمات المتكررة نوافذ على المعتقدات.","Repeated words are windows into beliefs."]},{id:28,comp:6,std:0,diff:"صعب",cat:"الاستماع النشط",catEn:"Active Listening",topic:["التلخيص الفعّال","Effective summarizing"],scenario:["تحدث العميل خمس دقائق بتفاصيل كثيرة عن ضغط العمل وتوتره مع مديره ورغبته في التوازن. أي تلخيص هو الأفضل؟","The client spoke for five minutes with many details about work pressure, tension with his manager and his wish for balance. Which summary is best?"],correct:1,options:[['"واضح أن مديرك شخص صعب وأنك تعاني من الاحتراق الوظيفي".','"Clearly your manager is difficult and you’re burning out."',"غير صحيح. يضيف تفسيرات وأحكاماً لم يقلها العميل.","Incorrect. Adds interpretations and judgments the client didn’t say."],['"سمعتك تتحدث عن ضغط العمل، وتوتر مع مديرك، ورغبة في التوازن؛ هل هذا دقيق؟ وما الأهم بينها الآن؟".','"I heard you talk about work pressure, tension with your manager and a wish for balance — is that accurate? Which matters most right now?"',"صحيح. تلخيص موجز بكلمات العميل مع التحقق من الدقة (المؤشر 6.2).","Correct. A concise summary in the client’s words, checking accuracy (indicator 6.2)."],["يعيد كل ما قاله العميل حرفياً لخمس دقائق.","Repeat everything the client said word for word for five minutes.","غير صحيح. التكرار الحرفي الطويل ليس تلخيصاً فعالاً.","Incorrect. Long verbatim repetition is not effective summarizing."],["يتجاوز التلخيص ويقترح حلاً لتنظيم الوقت.","Skip summarizing and suggest a time-management solution.","غير صحيح. قفز للحلول دون فهم مشترك.","Incorrect. Jumps to solutions without shared understanding."]],ref:["الجدارة 6 (المؤشر 6.2)","Competency 6 (indicator 6.2)"],detail:["يعكس الكوتش أو يلخص ما نقله العميل لضمان الوضوح والفهم.","The coach reflects or summarizes what the client communicated to ensure clarity and understanding."],take:["التلخيص الجيد: موجز، بكلمات العميل، وينتهي بسؤال تحقق.","A good summary is brief, in the client’s words, and ends with a check-in question."]},{id:29,comp:7,std:0,diff:"متوسط",cat:"إثارة الوعي",catEn:"Evoking Awareness",topic:["اختيار السؤال الأقوى","Choosing the most powerful question"],scenario:['يقول العميل: "أنا محتار بين عرضين وظيفيين ولا أعرف ماذا أختار". أي سؤال يثير الوعي أكثر؟','The client says: "I’m torn between two job offers and don’t know which to choose." Which question best evokes awareness?'],correct:2,options:[['"أي العرضين راتبه أعلى؟"','"Which offer pays more?"',"غير دقيق. سؤال مغلق يجمع معلومات فقط.","Not accurate. A closed question that only gathers information."],['"لماذا لم تقرر حتى الآن؟"','"Why haven’t you decided yet?"','غير صحيح. "لماذا" هنا تحمل لوماً وتدفع للتبرير.','Incorrect. "Why" here implies blame and invites justification.'],['"ما الأهم بالنسبة لك في هذا القرار؟"','"What matters most to you in this decision?"',"صحيح. سؤال مفتوح يستكشف قيم العميل ومعاييره (المؤشر 7.3).","Correct. An open question exploring the client’s values and criteria (indicator 7.3)."],['"هل جربت كتابة قائمة بالإيجابيات والسلبيات؟"','"Have you tried writing a pros-and-cons list?"',"غير صحيح. نصيحة مقنّعة على شكل سؤال.","Incorrect. Advice disguised as a question."]],ref:["الجدارة 7: إثارة الوعي","Competency 7: Evokes Awareness"],detail:["يطرح الكوتش أسئلة عن العميل وطريقة تفكيره وقيمه واحتياجاته.","The coach asks questions about the client — their thinking, values and needs."],take:["السؤال القوي يركز على العميل لا على المشكلة.","A powerful question focuses on the client, not the problem."]},{id:30,comp:7,std:0,diff:"صعب",cat:"إثارة الوعي",catEn:"Evoking Awareness",topic:["العمل مع استعارة العميل","Working with the client’s metaphor"],scenario:['يقول العميل: "أشعر أنني أحمل حقيبة ظهر ثقيلة جداً منذ أشهر". ما أفضل استجابة؟','The client says: "I feel like I’ve been carrying a very heavy backpack for months." What is the best response?'],correct:0,options:[['"ما الذي يوجد داخل هذه الحقيبة؟ وماذا تريد أن تفعل بها؟"','"What’s inside this backpack? And what would you like to do with it?"',"صحيح. يستكشف استعارة العميل بكلماته لتعميق الوعي (المؤشر 7.4).","Correct. Explores the client’s own metaphor to deepen awareness (indicator 7.4)."],['"بالنسبة لي يبدو الأمر كأنك تتسلق جبلاً صعباً".','"To me it sounds like you’re climbing a hard mountain."',"غير صحيح. يستبدل استعارة العميل باستعارة الكوتش.","Incorrect. Replaces the client’s metaphor with the coach’s."],["يتجاهل الاستعارة ويسأل عن عدد ساعات العمل.","Ignore the metaphor and ask about working hours.","غير صحيح. يفوّت المعنى العميق لما قاله العميل.","Incorrect. Misses the deeper meaning of what the client said."],['"هذا يعني أنك مصاب بالاكتئاب".','"That means you’re depressed."',"غير صحيح. تشخيص وتفسير خارج نطاق الكوتشينج.","Incorrect. A diagnosis and interpretation outside the coaching scope."]],ref:["الجدارة 7: إثارة الوعي","Competency 7: Evokes Awareness"],detail:["يستخدم الكوتش الاستعارات والتشبيهات لتوسيع وعي العميل.","The coach uses metaphor and analogy to expand the client’s awareness."],take:["استعارة العميل ملكه؛ استكشفها ولا تستبدلها.","The client’s metaphor belongs to him — explore it, don’t replace it."]},{id:31,comp:8,std:0,diff:"متوسط",cat:"تسهيل النمو",catEn:"Facilitating Growth",topic:["خطة عمل غير واقعية","Unrealistic action plan"],scenario:["في نهاية الجلسة، يضع العميل بحماس عشر مهام كبيرة لينجزها خلال أسبوع واحد. ما التصرف الأنسب؟","At the end of the session the client enthusiastically lists ten big tasks to complete in one week. What is best?"],correct:3,options:[["يمدح حماسه وينهي الجلسة.","Praise his enthusiasm and end the session.","غير صحيح. يفوّت فرصة دعم العميل في تصميم خطة واقعية.","Incorrect. Misses the chance to support a realistic plan."],["يختصر القائمة إلى مهمتين نيابة عنه.","Cut the list down to two tasks for him.","غير صحيح. يسلب العميل استقلاليته في تصميم خطته.","Incorrect. Takes away the client’s autonomy in designing his plan."],["يضيف له مهاماً أخرى ليستغل حماسه.","Add more tasks to make use of his enthusiasm.","غير صحيح. الكوتش لا يكلّف العميل بواجبات.","Incorrect. The coach doesn’t assign homework."],["يستكشف معه مدى واقعية الخطة ومستوى التزامه، والدعم والعقبات المحتملة، ويترك له تحديد الأولويات.","Explore with him how realistic the plan is, his commitment level, support and potential obstacles, and let him set priorities.","صحيح. شراكة في تصميم الأفعال مع احترام استقلالية العميل (المؤشرات 8.2 و8.3 و8.5).","Correct. Partners on designing actions while respecting autonomy (indicators 8.2, 8.3 & 8.5)."]],ref:["الجدارة 8: تسهيل نمو العميل","Competency 8: Facilitates Client Growth"],detail:["يدعو الكوتش العميل للتفكير في كيفية المضي قدماً بما في ذلك الموارد والعقبات.","The coach invites the client to consider how to move forward, including resources and barriers."],take:["الخطة الجيدة يملكها العميل ويستطيع تنفيذها فعلاً.","A good plan is owned by the client and genuinely doable."]},{id:32,comp:8,std:0,diff:"صعب",cat:"تسهيل النمو",catEn:"Facilitating Growth",topic:["عدم تنفيذ الالتزام","Commitment not completed"],scenario:["في الجلسة التالية يخبرك العميل بخجل أنه لم ينفذ أي شيء مما التزم به. كيف تستجيب؟","In the next session the client tells you, embarrassed, that he didn’t do anything he committed to. How do you respond?"],correct:1,options:[["يعبر عن خيبة أمله ليحفزه على الالتزام.","Express disappointment to motivate him to commit.","غير صحيح. الحكم والضغط يهدمان الأمان.","Incorrect. Judgment and pressure destroy safety."],["يستقبل ذلك دون حكم، ويستكشف معه ما الذي اعترض طريقه وما تعلمه، ثم يعيد تصميم الخطوة بشراكة.","Receive it without judgment, explore what got in the way and what he learned, then redesign the step together.",'صحيح. يحول "الفشل" إلى تعلم ويدعم المساءلة الذاتية (المؤشرات 8.1 و8.4).','Correct. Turns "failure" into learning and supports self-accountability (indicators 8.1 & 8.4).'],["يتجاوز الموضوع ليتجنب إحراجه.","Skip the topic to avoid embarrassing him.","غير دقيق. يضيع فرصة تعلم مهمة.","Not accurate. Wastes an important learning opportunity."],["يذكّره بأن الكوتشينج لا ينجح إلا مع الملتزمين.","Remind him that coaching only works for committed people.","غير صحيح. وعظ ولوم يضران بالعلاقة.","Incorrect. Lecturing and blame harm the relationship."]],ref:["الجدارة 8 والجدارة 4","Competencies 8 & 4"],detail:["يعمل الكوتش مع العميل لدمج التعلم الجديد في سلوكه ويدعم استقلاليته.","The coach works with the client to integrate learning into behavior and supports autonomy."],take:["لا يوجد فشل في الكوتشينج، يوجد تعلم.","There is no failure in coaching — only learning."]},{id:33,comp:8,std:0,diff:"متوسط",cat:"تسهيل النمو",catEn:"Facilitating Growth",topic:["إغلاق الجلسة","Closing the session"],scenario:["بقيت خمس دقائق على نهاية الجلسة. ما أفضل طريقة لإغلاقها وفق معايير ICF؟","Five minutes remain in the session. What is the best way to close it according to ICF standards?"],correct:2,options:[["يلخص الكوتش استنتاجاته الشخصية عن العميل.","The coach summarizes his own conclusions about the client.","غير صحيح. التعلم يجب أن يصوغه العميل.","Incorrect. The learning should be articulated by the client."],["ينهي الجلسة فور انتهاء الوقت دون إغلاق.","End the session as soon as time is up, without closure.","غير صحيح. يفوّت ترسيخ التعلم والالتزام.","Incorrect. Misses consolidating learning and commitment."],["يسأل العميل عما اكتشفه أو تعلمه عن نفسه، وكيف سيأخذه معه، ويحتفل بتقدمه.","Ask the client what he discovered or learned about himself, how he’ll take it forward, and celebrate his progress.","صحيح. تلخيص التعلم بشراكة والاحتفال بالتقدم (المؤشرات 8.6 و8.7).","Correct. Summarizing learning in partnership and celebrating progress (indicators 8.6 & 8.7)."],["يقدم نصيحة أخيرة مفيدة قبل المغادرة.","Give one last useful piece of advice before leaving.","غير صحيح. النصيحة تخرج عن دور الكوتش.","Incorrect. Advice falls outside the coach’s role."]],ref:["الجدارة 8 (المؤشرات 8.6 و8.7)","Competency 8 (indicators 8.6 & 8.7)"],detail:["يشارك الكوتش العميل في تلخيص التعلم ويغلق الجلسة بشراكة.","The coach partners with the client to summarize learning and closes the session in partnership."],take:["الإغلاق الجيد يرسّخ ما تعلمه العميل بكلماته.","A good close anchors what the client learned — in his own words."]},{id:34,comp:1,std:3,diff:"متوسط",cat:"الأخلاقيات",catEn:"Ethics",topic:["مناقشة حالة مع مُرشِد الكوتشينج","Discussing a case with a mentor"],scenario:["تريد مناقشة حالة صعبة لأحد عملائك مع مُرشِد الكوتشينج (Mentor) لتطوير أدائك. ما التصرف الأخلاقي؟","You want to discuss a challenging client case with your mentor coach to improve your practice. What is the ethical approach?"],correct:0,options:[["يناقش الحالة دون ذكر أي معلومات تكشف هوية العميل.","Discuss the case without any information that could identify the client.","صحيح. يحافظ على السرية ويستفيد من الإشراف المهني (المعياران 3 و13).","Correct. Protects confidentiality while benefiting from supervision (Standards 3 & 13)."],["يذكر اسم العميل وشركته ليحصل على نصيحة أدق.","Mention the client’s name and company to get more accurate advice.","غير صحيح. خرق صريح للسرية.","Incorrect. A clear breach of confidentiality."],["لا يناقش أي حالة أبداً مع أي شخص.","Never discuss any case with anyone.","غير دقيق. الإشراف المهني مسموح ومفيد ما دامت الهوية محمية.","Not accurate. Supervision is allowed and valuable when identity is protected."],["ينشر الحالة على لينكدإن دون اسم لكن بتفاصيل دقيقة.","Post the case on LinkedIn without a name but with precise details.","غير صحيح. التفاصيل الدقيقة قد تكشف الهوية.","Incorrect. Precise details may reveal identity."]],ref:["مدونة الأخلاقيات: المعياران 3 و13","Code of Ethics: Standards 3 & 13"],detail:["يحافظ الكوتش على أقصى درجات السرية، ويلتزم بالتطوير المهني المستمر.","The coach maintains strict confidentiality and commits to continuous development."],take:["الإشراف نعم، كشف الهوية لا.","Supervision: yes. Revealing identity: no."]},{id:35,comp:1,std:5,diff:"صعب",cat:"الأخلاقيات",catEn:"Ethics",topic:["الكوتش الداخلي وتعدد الأدوار","Internal coach and multiple roles"],scenario:["تعمل في الموارد البشرية وككوتش داخلي. يطلب منك المدير تقديم كوتشينج لموظف، ثم إبداء رأيك في ترقيته لاحقاً. ما التصرف الأنسب؟","You work in HR and as an internal coach. The director asks you to coach an employee and later give your opinion on his promotion. What is best?"],correct:3,options:[["يقبل الدورين معاً لأنه يعرف الموظف جيداً.","Accept both roles since he knows the employee well.","غير صحيح. تعارض أدوار يهدد السرية والحياد.","Incorrect. A role conflict threatening confidentiality and neutrality."],["يقبل ويستخدم ما يعرفه من الجلسات في تقييم الترقية.","Accept and use what he learns in sessions for the promotion assessment.","غير صحيح. استغلال معلومات سرية خرق جسيم.","Incorrect. Using confidential information is a serious breach."],["يرفض الكوتشينج دون أي توضيح.","Refuse the coaching without any explanation.","غير دقيق. يفتقر للشفافية في إدارة التعارض.","Not accurate. Lacks transparency in managing the conflict."],["يوضح تعارض الأدوار منذ البداية، ويعتذر عن الدور التقييمي أو يقترح كوتشاً خارجياً، ويتفق على حدود السرية بوضوح.","Clarify the role conflict upfront, decline the evaluative role or suggest an external coach, and agree clear confidentiality boundaries.","صحيح. إدارة الأدوار المتعددة بوضوح وتجنب تضارب المصالح (المعياران 5 و21).","Correct. Manages multiple roles clearly and avoids conflict of interest (Standards 5 & 21)."]],ref:["مدونة الأخلاقيات: المعياران 5 و21","Code of Ethics: Standards 5 & 21"],detail:["يفهم الكوتش ويدير بوضوح الظروف التي قد تتعارض فيها الأدوار.","The coach understands and clearly manages conditions where roles may conflict."],take:["لا تجمع بين دور الكوتش ودور المقيّم لنفس الشخص.","Never combine the coach and evaluator roles for the same person."]},{id:36,comp:1,std:6,diff:"متوسط",cat:"الأخلاقيات",catEn:"Ethics",topic:["رغبة العميل في إنهاء البرنامج","Client wants to end the program"],scenario:["بعد 3 جلسات من برنامج من 10 جلسات، يخبرك العميل أنه يريد التوقف. ما التصرف الأنسب؟","After 3 sessions of a 10-session program, the client tells you he wants to stop. What is best?"],correct:1,options:[["يضغط عليه للاستمرار لأن الأهداف لم تكتمل.","Pressure him to continue because the goals aren’t complete.","غير صحيح. يخالف حق العميل في إنهاء العلاقة.","Incorrect. Violates the client’s right to end the relationship."],["يحترم قراره، ويستكشف بلطف إن كان العميل يرغب في مشاركة ما تعلمه، ويطبق بنود الاتفاقية بشأن الإنهاء والرسوم.","Respect his decision, gently invite him to share what he learned if he wishes, and apply the agreement’s termination and fee terms.","صحيح. احترام حق الإنهاء والالتزام بالاتفاقية (المعيار 6).","Correct. Respects the right to terminate and honors the agreement (Standard 6)."],["يرفض أي استرداد حتى لو نص العقد عليه.","Refuse any refund even if the contract provides for it.","غير صحيح. مخالفة للاتفاقية والنزاهة.","Incorrect. Violates the agreement and integrity."],["يخبر الراعي بأن العميل غير جاد.","Tell the sponsor the client isn’t serious.","غير صحيح. خرق للسرية وحكم على العميل.","Incorrect. Breach of confidentiality and judgment of the client."]],ref:["مدونة الأخلاقيات: المعيار 6","Code of Ethics: Standard 6"],detail:["يحترم الكوتش حق العميل في إنهاء العلاقة في أي وقت وفق بنود الاتفاقية.","The coach respects the client’s right to end the relationship at any time per the agreement."],take:["قرار الإنهاء ملك للعميل.","The decision to end belongs to the client."]},{id:37,comp:1,std:9,diff:"صعب",cat:"الأخلاقيات",catEn:"Ethics",topic:["اهتمام عاطفي من العميل","Romantic interest from a client"],scenario:["في نهاية جلسة، يعبر العميل عن إعجابه الشخصي بك ويدعوك لتناول العشاء. ما التصرف الأنسب؟","At the end of a session the client expresses personal attraction and invites you to dinner. What is best?"],correct:2,options:[["يقبل الدعوة لأن البرنامج اقترب من نهايته.","Accept since the program is nearly over.","غير صحيح. علاقة شخصية مع عميل حالي محظورة.","Incorrect. A personal relationship with a current client is prohibited."],["يتجاهل الموضوع تماماً ويكمل كأن شيئاً لم يحدث.","Ignore it completely and carry on as if nothing happened.","غير دقيق. الحدود تحتاج توضيحاً صريحاً.","Not accurate. Boundaries need explicit clarification."],["يعتذر بوضوح واحترام، ويؤكد الحدود المهنية، وإذا أثر ذلك على العلاقة يفكر في إنهائها وإحالة العميل لكوتش آخر.","Decline clearly and respectfully, reaffirm professional boundaries, and if it affects the relationship consider ending it and referring the client to another coach.","صحيح. يتجنب أي علاقة عاطفية ويحمي نزاهة العلاقة (المعيار 9).","Correct. Avoids any romantic relationship and protects integrity (Standard 9)."],["يستمر في الكوتشينج ويلتقي العميل سراً خارج الجلسات.","Continue coaching and meet the client secretly outside sessions.","غير صحيح. انتهاك جسيم للمعايير الأخلاقية.","Incorrect. A serious ethical violation."]],ref:["مدونة الأخلاقيات: المعيار 9","Code of Ethics: Standard 9"],detail:["يتجنب الكوتش أي علاقة رومانسية أو جنسية مع العملاء أو الرعاة.","The coach avoids any romantic or sexual relationship with clients or sponsors."],take:["الحدود المهنية تحمي العميل والكوتش والمهنة.","Professional boundaries protect the client, the coach and the profession."]},{id:38,comp:1,std:11,diff:"متوسط",cat:"الإحالة ومتخصصين",catEn:"Referral",topic:["طلب استشارة قانونية","Request for legal advice"],scenario:['يسألك العميل أثناء الجلسة: "ما رأيك القانوني في تقسيم الممتلكات في قضية طلاقي؟". ما التصرف الأنسب؟','During a session the client asks: "What’s your legal opinion on dividing property in my divorce case?" What is best?'],correct:3,options:[["يعطيه رأياً قانونياً عاماً من معرفته.","Give him a general legal opinion from his knowledge.","غير صحيح. نصيحة خارج نطاق الكفاءة (المعيار 11).","Incorrect. Advice outside competence (Standard 11)."],["يرفض الحديث عن أي شيء يتعلق بالطلاق.","Refuse to discuss anything related to the divorce.","غير صحيح. يمكن دعم العميل في كيفية التعامل مع الموقف.","Incorrect. The client can be supported in how he wants to handle the situation."],["يبحث معه في الإنترنت عن القوانين ذات الصلة.","Search the internet together for relevant laws.","غير صحيح. يتحول لدور المستشار القانوني.","Incorrect. Shifts into a legal adviser role."],["يوضح أن ذلك خارج نطاق الكوتشينج ويقترح استشارة محامٍ، مع إمكانية دعم العميل في طريقة تعامله مع الموقف وقراراته.","Clarify it’s outside coaching, suggest consulting a lawyer, and offer to support the client in how he approaches the situation and his decisions.","صحيح. يحدد النطاق ويحيل للمختص ويواصل الدعم ضمن دوره (المعياران 7 و11).","Correct. Clarifies scope, refers to a specialist and keeps supporting within role (Standards 7 & 11)."]],ref:["مدونة الأخلاقيات: المعياران 7 و11","Code of Ethics: Standards 7 & 11"],detail:["لا يقدم الكوتش نصائح خارج نطاق كفاءته، ويقترح متخصصين آخرين عند الحاجة.","The coach gives no advice outside competence and suggests other professionals when needed."],take:["الإحالة لا تعني إنهاء الكوتشينج؛ بل توضيح الأدوار.","Referral doesn’t mean ending coaching — it means clarifying roles."]},{id:39,comp:1,std:16,diff:"متوسط",cat:"الأخلاقيات",catEn:"Ethics",topic:["حفظ ملاحظات الجلسات","Storing session notes"],scenario:["تحفظ ملاحظات جلساتك بأسماء العملاء في تطبيق ملاحظات على جهاز لوحي يستخدمه أفراد أسرتك. ما التصرف الصحيح؟","You keep session notes with client names in a notes app on a tablet your family also uses. What is correct?"],correct:0,options:[["ينقل الملاحظات إلى مكان آمن ومحمي بكلمة مرور أو مشفّر، ويتخلص من السجلات القديمة بأمان وفق قوانين حماية البيانات.","Move the notes to a secure, password-protected or encrypted place and dispose of old records safely per data-protection laws.","صحيح. يحفظ السجلات ويتخلص منها بما يحمي السرية والخصوصية (المعيار 16).","Correct. Stores and disposes of records in a way that protects confidentiality (Standard 16)."],["لا مشكلة لأن أسرته لن تهتم بقراءتها.","It’s fine because his family won’t bother reading them.","غير صحيح. الخطر قائم والمسؤولية على الكوتش.","Incorrect. The risk exists and the responsibility is the coach’s."],["يكتب الأسماء بأحرف أولى فقط ويبقيها على نفس الجهاز.","Use initials only but keep them on the same shared device.","غير كافٍ. التفاصيل قد تكشف الهوية والجهاز غير آمن.","Not enough. Details may reveal identity and the device isn’t secure."],["يتوقف عن كتابة أي ملاحظات نهائياً.","Stop taking any notes at all.","غير دقيق. الملاحظات مسموحة إذا حُفظت بأمان.","Not accurate. Notes are fine when stored securely."]],ref:["مدونة الأخلاقيات: المعيار 16","Code of Ethics: Standard 16"],detail:["ينشئ الكوتش السجلات ويحفظها ويتخلص منها بطريقة تعزز السرية والخصوصية.","The coach creates, stores and disposes of records in a manner that promotes confidentiality and privacy."],take:["سرية العميل تشمل ملاحظاتك على جهازك.","Client confidentiality includes the notes on your device."]},{id:40,comp:1,std:26,diff:"متوسط",cat:"الأخلاقيات",catEn:"Ethics",topic:["نشر شهادات العملاء","Publishing client testimonials"],scenario:["أرسل لك عميل رسالة شكر مؤثرة، وتريد نشرها على موقعك الإلكتروني. ما التصرف الأخلاقي؟","A client sent you a touching thank-you message and you want to publish it on your website. What is the ethical approach?"],correct:2,options:[["ينشرها باسم العميل الكامل لأنها رسالة إيجابية.","Publish it with the client’s full name since it’s positive.","غير صحيح. النشر دون إذن يخالف السرية.","Incorrect. Publishing without permission breaches confidentiality."],["يعدّل الرسالة ليجعلها أقوى تسويقياً.","Edit the message to make it stronger for marketing.","غير صحيح. تحريف الشهادة تضليل للجمهور.","Incorrect. Altering a testimonial misleads the public."],["يطلب إذناً كتابياً صريحاً من العميل، ويتفق معه على طريقة ذكر اسمه، وينشرها كما هي دون تعديل.","Ask for explicit written permission, agree how his name will appear, and publish it as-is without edits.","صحيح. الصدق والشفافية في التسويق مع حماية السرية (المعياران 3 و26).","Correct. Honesty and transparency in marketing while protecting confidentiality (Standards 3 & 26)."],["يكتب شهادات إضافية مشابهة بأسماء وهمية.","Write additional similar testimonials under fake names.","غير صحيح. شهادات وهمية خداع صريح.","Incorrect. Fake testimonials are outright deception."]],ref:["مدونة الأخلاقيات: المعياران 3 و26","Code of Ethics: Standards 3 & 26"],detail:["يلتزم الكوتش بالصدق والشفافية في التسويق ويحمي سرية العملاء.","The coach maintains honesty and transparency in marketing and protects client confidentiality."],take:["لا نشر دون إذن، ولا تعديل، ولا شهادات وهمية.","No publishing without consent, no edits, no fake testimonials."]}],Xg=qm.map(d=>({id:d.id,competencyId:d.comp,standardId:d.std,topic:d.topic[0],category:d.cat,difficulty:d.diff,scenario:d.scenario[0],options:d.options.map((p,m)=>({letter:Om[m],text:p[0],isCorrect:m===d.correct,feedback:p[2]})),reference:d.ref[0],referenceDetail:d.detail[0],keyTakeaway:d.take[0]})),Vg=Object.fromEntries(qm.map(d=>[d.id,{topic:d.topic[1],category:d.catEn,scenario:d.scenario[1],options:d.options.map((p,m)=>({letter:Om[m],text:p[1],feedback:p[3]})),reference:d.ref[1],referenceDetail:d.detail[1],keyTakeaway:d.take[1]}])),tl=[{id:1,group:"A",groupNameAr:"الأساس (Foundation)",groupNameEn:"Foundation",nameAr:"إظهار الممارسة الأخلاقية",nameEn:"Demonstrates Ethical Practice",shortDesc:"فهم وتطبيق أخلاقيات ومعايير الكوتشينج باستمرار وبنزاهة تامة.",fullExplanation:"يُعرّف هذا المعيار التزام الكوتش التام بمدونة أخلاقيات الاتحاد الدولي للكوتشينج وقيمها الأساسية (النزاهة، التميز، التعاون، الاحترام). يتطلب من الكوتش حماية سرية العميل بشكل لا يتزعزع، والتفريق الحاسم بين الكوتشينج والاستشارة والعلاج النفسي، والتصرف بنزاهة وصدق، والإحالة للمختصين عند الحاجة.",practicalApplication:"عند توقيع العقد، وضّح حدود السرية (مثل التهديد بإيذاء النفس أو مخالفة القانون الصريحة)، وحدد أدوار الراعي (Sponsor) والعميل (Client). لا تقدم نصائح أو تشخيصات نفسية أو حلولاً جاهزة.",realWorldScenario:'أثناء الجلسة الرابعة، يخبرك العميل أنه يمر بنوبات قلق واكتئاب حادة تمنعه من النوم والعمل منذ شهرين، ويريد منك "علاجاً سرياً" دون إخبار مديره الراعي. التصرف الأخلاقي: الاعتراف بمشاعره بتقدير، توضيح أن الكوتشينج ليس علاجاً نفسياً، وإحالته إلى مختص صحة نفسية مع تعليق أو تكييف جلسات الكوتشينج.',exploratoryQuestion:"كيف تتأكد أن العميل والراعي يفهمان تماماً الفرق الدقيق بين الكوتشينج والعلاج النفسي والاستشارات قبل بدء أي جلسة؟",behavioralIndicators:["يظهر النزاهة والصدق في كافة التعاملات مع العميل والراعي والمجتمع.","يحترم هوية العميل وبيئته وتجاربه وقيمه ومعتقداته دون أحكام مسبقة.","يستخدم لغة مناسبة ومحترمة تعكس المهنية العالية.","يلتزم بمدونة أخلاقيات ICF ويطبق القيم الجوهرية الأربع.","يحافظ بصرامة على سرية معلومات العميل وفق الاتفاقيات والقوانين السارية.","يميز بدقة بين الكوتشينج والخدمات المهنية الأخرى ويوضح الفروق للعميل.","يحيل العميل إلى متخصصين آخرين عند الضرورة الملحة أو عدم الملاءمة."],accExamFocus:"في امتحان ACC، إذا أظهر العميل أعراضاً سريرية أو طلب حلاً استشارياً، الخيار الصحيح دائماً هو توضيح نطاق الكوتشينج، استكشاف الإحالة، أو التمسك بالسرية تجاه الراعي."},{id:2,group:"A",groupNameAr:"الأساس (Foundation)",groupNameEn:"Foundation",nameAr:"تجسيد عقلية الكوتشينج",nameEn:"Embodies a Coaching Mindset",shortDesc:"تطوير عقلية منفتحة، وفضولية، ومرنة، وتتمحور تماماً حول العميل.",fullExplanation:"تتطلب هذه الجدارة أن يؤمن الكوتش بأن العميل خبير في حياته، ومسؤول تماماً عن خياراته وقراراته ونتائجه. تتضمن الممارسة التأملية المستمرة (Reflective Practice)، والاعتراف بأن الكوتش لا يمتلك الإجابات، والراحة في مساحة عدم المعرفة (Not Knowing)، مع تنظيم المشاعر والوعي الذاتي.",practicalApplication:'قبل دخول الجلسة، قم بتفريغ ذهنك من أعبائك الخاصة. أثناء الجلسة، عندما يطلب العميل: "ماذا ستفعل لو كنت مكاني؟"، لا تجب من تجربتك الشخصية، بل اطلب منه استكشاف خياراته الخاصة بحياد تام.',realWorldScenario:'يدخل العميل في حيرة شديدة بين قبول عرض وظيفي جديد أو البقاء في منصبه الحالي. يسألك: "أنت خبير إداري، برأيك ما القرار الأصح لي؟". بدلاً من التحليل، يسأله الكوتش: "أرى أنك تبحث عن اليقين الآن؛ ما المعايير الأكثر أهمية لقيمك ورؤيتك المستقبلية التي ترغب أن نزن الخيارات بناءً عليها؟".',exploratoryQuestion:"ما الممارسات التأملية التي تتبعها عقب كل جلسة كوتشينج للتأكد من أنك لم تفرض أفكارك أو تحيزاتك على المستفيد؟",behavioralIndicators:["يدرك ويقر بأن العميل مسؤول بالكامل عن خياراته وتطوره.","ينخرط في التعلم المستمر والتطوير المهني الذاتي ككوتش.","يطور ممارسة تأملية دورية لتحسين مهاراته واستبصاره.",'يظل منفتحاً وفضولياً ومتقبلاً لمساحة "عدم المعرفة".',"يدرك تأثير سياق وثقافة العميل على تفكيره وتوجهاته.","يستخدم الوعي الذاتي والحدس بمرونة لخدمة مصلحة العميل.","يحافظ على تنظيم المشاعر والهدوء في جميع الأوقات."],accExamFocus:'امتحان ACC يختبر ما إذا كان الكوتش يتخلى عن رغبة "إصلاح المشكلة" للعميل، ويركز بدلاً من ذلك على دعم العميل ليجد حلوله بنفسه.'},{id:3,group:"B",groupNameAr:"التشارك في صياغة العلاقة (Co-Creating the Relationship)",groupNameEn:"Co-Creating the Relationship",nameAr:"تأسيس الاتفاقيات والحفاظ عليها",nameEn:"Establishes and Maintains Agreements",shortDesc:"الشراكة مع العميل وأصحاب المصلحة لتحديد إرشادات ونطاق وأهداف العلاقة والجلسة.",fullExplanation:"تركز هذه الجدارة على بعدين: الاتفاقية الشاملة لعلاقة الكوتشينج (بين الكوتش والعميل والراعي)، واتفاقية كل جلسة مفردة (Session Agreement). في جلسة الكوتشينج، يجب على الكوتش أن يشارك العميل في تحديد: ما يريد تحقيقه اليوم، ولماذا هذا مهم له الآن، وما معايير قياس نجاح الجلسة، وما الذي يحتاج العميل لمعالجته لتحقيق ذلك.",practicalApplication:'لا تبدأ الخوض في تفاصيل القصة قبل الاتفاق على الهدف المحدد للجلسة. اسأل دائماً: "ما النتيجة الملموسة التي ترغب بالخروج بها في نهاية وقتنا اليوم؟ وكيف ستعرف أننا حققناها؟".',realWorldScenario:'يبدأ العميل بسرد مشاكل متعددة مع رئيسه وزملائه وزوجته لعشر دقائق. إذا قاطعه الكوتش بحلول فهذا خطأ. التصرف الصحيح للجدارة 3: يعكس الكوتش تشعب المواضيع ويقول: "لقد ذكرت عدة جوانب مترابطة ومهمة؛ من أين تحب أن نبدأ اليوم ليكون تركيزنا الأكثر قيمة لأولوياتك؟".',exploratoryQuestion:"كيف تعيد توجيه الجلسة بلباقة وشراكة عندما يبدأ العميل بالابتعاد تماماً عن الهدف الذي تم الاتفاق عليه في بداية الجلسة؟",behavioralIndicators:["يشرح ماهية الكوتشينج ويوضح الحدود والمسؤوليات مع العميل والراعي.","يتوصل إلى اتفاق محدد حول أهداف العملية ككل ومؤشرات قياسها.","يشارك العميل في تحديد ما يريد إنجازه أو معالجته في الجلسة المحددة.","يحدد معايير النجاح لما يرغب العميل في تحقيقه بنهاية الجلسة.","يساعد العميل على تحديد ما يحتاج لمعالجته للوصول إلى النتيجة المنشودة.","يدير الوقت وتركيز الجلسة بشراكة تامة مع العميل.","يواصل الكوتشينج بما يتوافق مع النتيجة المرجوة ما لم يقرر العميل تغيير الاتجاه."],accExamFocus:"أسئلة الاتفاقية في ACC تركز على التحقق من أن العميل هو من يحدد الهدف ومؤشر النجاح، وأن الكوتش يتحقق من مطابقة المسار خلال الجلسة دون فرض أجندته."},{id:4,group:"B",groupNameAr:"التشارك في صياغة العلاقة (Co-Creating the Relationship)",groupNameEn:"Co-Creating the Relationship",nameAr:"تنمية الثقة والأمان",nameEn:"Cultivates Trust and Safety",shortDesc:"الشراكة مع العميل لخلق بيئة آمنة وداعمة تتيح له التعبير بحرية وأمان.",fullExplanation:"بناء بيئة خالية من الأحكام حيث يشعر العميل بالأمان التام ليكون ضعيفاً، حقيقياً، وصادقاً. تشمل احترام هوية العميل وبيئته الثقافية، وإظهار الدعم والتعاطف غير المشروط، والاعتراف بتجارب العميل وإنجازاته، وتحمل الكوتش لضعفه البشري بشفافية وتواضع.",practicalApplication:'أظهر حضوراً دافئاً ومحترماً. عندما يعبر العميل عن خوف أو إخفاق، لا تقلل من شأن مشاعره بعبارات سطحية مثل "لا تقلق كل شيء سيمر"، بل اعترف بثقل الموقف واحتضن شجاعته في المشاركة.',realWorldScenario:"يبكي العميل فجأة معترفاً بأنه يشعر بالفشل التام كقائد بعد استقالة موظف بارز. التصرف السليم: الصمت لثوانٍ إكراماً للمشاعر، ثم الاعتراف بشجاعته في البوح، والتأكيد على المساحة الآمنة دون تقديم مواساة تافهة أو نصائح فورية.",exploratoryQuestion:"ما العلامات الدقيقة في لغة جسدك ونبرة صوتك التي تبني الأمان النفسي للعميل في اللحظات الحرجة والصعبة؟",behavioralIndicators:["يسعى بصدق لفهم العميل ضمن سياقه وثقافته وهويته وتجاربه.","يظهر الاحترام الكامل لقيم ومعتقدات العميل وأسلوبه الخاص.","يظهر التعاطف والأصالة والشفافية والدعم المستمر غير المشروط.","يدعم العميل في التعبير الحر عن مشاعره ومخاوفه وشكوكه دون حكم.","يحتفل بتقدم العميل وإنجازاته وسماته الفريدة وشجاعته.","يتقبل عدم الكمال ويعترف بنقاط الضعف البشرية بمهنية."],accExamFocus:"أي خيار فيه حكم مبطن، أو استعجال لتجاوز مشاعر العميل، أو إهمال لسياقه الثقافي هو خيار خاطئ في ACC."},{id:5,group:"B",groupNameAr:"التشارك في صياغة العلاقة (Co-Creating the Relationship)",groupNameEn:"Co-Creating the Relationship",nameAr:"الحفاظ على الحضور",nameEn:"Maintains Presence",shortDesc:"أن يكون الكوتش واعياً بالكامل، وحاضراً، ومرناً، ومتجاوباً مع العميل في اللحظة الراهنة.",fullExplanation:'القدرة على البقاء في اللحظة "هنا والآن"، دون الانشغال بالسؤال التالي أو بالتقنيات. تشمل المرونة في مواكبة تدفق الجلسة، والتعامل مع عدم اليقين بهدوء، واستخدام الصمت كأداة قوية تتيح للعميل استيعاب أفكاره والوصول إلى بصيرة عميقة.',practicalApplication:"عندما يطرح العميل فكرة مفاجئة تغير مسار الجلسة، لا تتشبث بخطتك السابقة؛ واكب العميل واستكشف ما طرأ بمرونة. تدرب على الصمت لثوانٍ بعد إجابة العميل لإعطائه فرصة للتأمل الأعمق.",realWorldScenario:"يسأل الكوتش سؤالاً عميقاً، فيتوقف العميل وينظر في الأفق صامتاً لمدة 15 ثانية. الكوتش المبتدئ يقاطع الصمت بسؤال آخر خوفاً من الإحراج. كوتش الـ ICF المحترف يحافظ على الحضور الهادئ والمشجع بالصمت حتى يستجمع العميل بصيرته وينطق.",exploratoryQuestion:"ما الذي يحدث بداخلك أثناء لحظات الصمت الطويلة في الجلسة، وكيف تدير رغبتك العفوية في ملء الفراغ؟",behavioralIndicators:["يظل متيقظاً ومرناً وحاضراً بالكامل مع العميل طوال الجلسة.","يظهر الفضول والهدوء والتركيز والانفتاح التام.","يدير مشاعره الذاتية ليبقى مركزاً وموجهاً لصالح العميل.",'يرتاح ويثق في مساحة "عدم المعرفة" ويتجنب الافتراضات.',"يخلق مساحة للصمت والتأمل والوقوف دون استعجال.","يتحرك برشاقة وتوافق مع طاقة العميل ومسار الحوار في اللحظة الحالية."],accExamFocus:"في ACC، الصمت الفعال والتكيف مع التغير اللحظي للعميل يرجحان على إلقاء الأسئلة المتلاحقة أو التمسك بالأجندة."},{id:6,group:"C",groupNameAr:"التواصل الفعال (Communicating Effectively)",groupNameEn:"Communicating Effectively",nameAr:"الاستماع النشط",nameEn:"Listens Actively",shortDesc:"التركيز على ما يُقال وما لا يُقال لفهم معنى حديث العميل في سياقه الكامل.",fullExplanation:"الاستماع على المستويات الثلاثة: مستوى الكلمات، مستوى المشاعر والنبرة ولغة الجسد، ومستوى المعنى العميق وسياق هوية العميل. يدمج الكوتش كلمات العميل الخاصة دون إعادة صياغة مشوهة، ويلتقط التناقضات بين الأقوال والأفعال أو نبرة الصوت بلباقة واهتمام.",practicalApplication:'استخدم كلمات العميل الدقيقة (مثل استخدامه لكلمة "جبل جاثم على صدري") بدلاً من استبدالها بكلماتك الشخصية. لاحظ تحولات الطاقة والنبرة عندما يتحدث عن أشخاص أو مواقف معينة وعكسها له بحياد.',realWorldScenario:'يقول العميل بابتسامة متكلفة ونبرة صوت منخفضة: "أنا سعيد جداً بالترقية الجديدة، إنها رائعة تماماً!". يلاحظ الكوتش التناقض بين الكلمات ونبرة الصوت ويعكس: "سمعتك تقول أنك سعيد، لكن نبرة صوتك بدت هادئة ومثقلة نوعاً ما؛ ما الذي يدور بداخلك حقيقةً حول هذه الترقية؟".',exploratoryQuestion:"كيف تميز أثناء الاستماع بين سماع تفاصيل القصة الخارجية وبين الاستماع إلى معتقدات العميل ونظرته لنفسه؟",behavioralIndicators:["يأخذ في الاعتبار سياق العميل وهويته وبيئته وثقافته ومعتقداته.","يستمع إلى ما يقوله العميل وما لا يقوله (المعاني غير المنطوقة).","يلتقط التناقضات والأنماط المتكررة في تفكير العميل وتصرفاته.","يعكس أو يلخص بوضوح ما نقله العميل لضمان الفهم المشترك.","يتعرف على مشاعر العميل وتحولات طاقته ولغة جسده ونبرته.","يدمج كلمات العميل الخاصة واستعاراته في الحوار دون تشويه."],accExamFocus:"الاستماع النشط لا يعني مجرد ترديد الكلام كالببغاء؛ بل استيعاب المشاعر الكامنة واستكشاف التناقضات اللطيفة دون استجواب."},{id:7,group:"C",groupNameAr:"التواصل الفعال (Communicating Effectively)",groupNameEn:"Communicating Effectively",nameAr:"إثارة الوعي",nameEn:"Evokes Awareness",shortDesc:"تيسير بصيرة العميل وتفكيره العميق من خلال الأدوات والأسئلة القوية والمجاز والتحدي الإيجابي.",fullExplanation:"مساعدة العميل على رؤية ما وراء أفكاره الحالية، واستكشاف الافتراضات المقيدة والمعتقدات غير الواعية. يتم ذلك عبر طرح أسئلة مفتوحة وقصيرة وموجهة نحو الاستكشاف، واستخدام التشبيهات والاستعارات، ومشاركة الملاحظات والحدس دون تشبث بصوابها، وتحدي العميل بلباقة لتوسيع إدراكه.",practicalApplication:'تجنب الأسئلة التوجيهية ذات الطابع الاستجوابي (مثل: "ألم تفكر في محادثة مديرك؟") واستبدلها بأسئلة مفتوحة حقيقية تثير التفكير (مثل: "ما الافتراض الذي تبني عليه هذا التردد؟").',realWorldScenario:'يقول العميل: "أنا محاصر في زاوية ضيقة ولا أملك أي خيار سوى الاستسلام". يسأل الكوتش: "لو تخيلت أنك تقف على قمة جبل مرتفع وتنظر إلى هذه الزاوية من الأعلى، ما المشهد الأوسع الذي قد تراه ولم تنتبه له بعد؟".',exploratoryQuestion:"ما معيارك للسؤال الذي يثير الوعي بحق مقارنة بالسؤال الذي يبحث فقط عن جمع معلومات للفضول؟",behavioralIndicators:["يطرح أسئلة مفتوحة وقوية تتحدى التفكير الحالي وتستكشف ما وراء السطح.","يساعد العميل على استكشاف الافتراضات والقيم والمعتقدات التي تؤثر عليه.","يشارك الملاحظات والحدس والمشاعر الصادقة دون التعلق بصحتها.","يدعو العميل لاستخدام الاستعارات والمجازات لتوضيح معانيه وتوسيع أفقه.","يساعد العميل على إعادة صياغة وجهات نظره واكتشاف زوايا جديدة.","يضبط وتيرة الحوار لتمكين العميل من معالجة المعاني والوصول للبصيرة."],accExamFocus:"في اختبار ACC، الأسئلة القوية هي دائماً أسئلة مفتوحة (ماذا، كيف) تبدأ من كلمات العميل وتستهدف نمط تفكيره وليس تجميع تفاصيل درامية."},{id:8,group:"D",groupNameAr:"تنمية التعلم والنمو (Cultivating Learning and Growth)",groupNameEn:"Cultivating Learning and Growth",nameAr:"تسهيل نمو العميل",nameEn:"Facilitates Client Growth",shortDesc:"الشراكة مع العميل لتحويل التعلم والاستبصار إلى أفعال وخطوات ملموسة وذات معنى.",fullExplanation:"الهدف النهائي لجلسة الكوتشينج هو أن يترجم العميل الوعي الجديد الذي اكتسبه إلى خطوات عملية، وقرارات، ونمو مستدام. تتضمن هذه الجدارة مساعدة العميل على تحديد خطة عمل قابلة للتطبيق، وتحديد الموارد والعقبات المحتملة، وتحديد كيفية متابعة التزامه ومحاسبة نفسه (Accountability)، والاحتفال بالتقدم.",practicalApplication:'في الجزء الأخير من الجلسة، اسأل: "مع هذا الوعي الجديد الذي اكتشفته اليوم، ما الخطوة الأولى الملموسة التي ستتخذها؟ متى ستبدأ؟ وكيف ستحافظ على التزامك تجاهها؟". دع العميل هو من يضع الخطة بالكامل.',realWorldScenario:'بعد أن اكتشف العميل سبب تسويفه لمشروع مهم، كان الكوتش قد اقترب من نهاية الجلسة. بدلاً من أن يقترح الكوتش جدولاً زمنياً، سأل العميل: "ما الإجراء الأكثر فاعلية الذي تشعر بالحماس لتنفيذه قبل اجتماعنا القادم؟ ومن أو ما الذي قد يدعمك في ذلك؟".',exploratoryQuestion:"كيف تدعم العميل في تصميم نظام المحاسبة والمساءلة الذاتية دون أن تصبح أنت الرقيب أو المعلم؟",behavioralIndicators:["يشرك العميل في دمج الاستبصار الجديد في منظومة تفكيره وسلوكه اليومي.","يتعاون مع العميل لتصميم أهداف وخطوات عمل قابلة للتحقيق وذات معنى.","يدعم العميل في تحديد الدعم والموارد والشراكات المتاحة لتيسير النجاح.","يساعد العميل على توقع العقبات المحتملة وتحديد استراتيجيات للتغلب عليها.","يشارك العميل في وضع معايير للمساءلة الذاتية ومتابعة التقدم.","يحتفل مع العميل بتقدمه وتطوره ونموه الذاتي باستمرار.","يختتم الجلسات بشراكة تتيح للعميل استخلاص ما تعلمه عن نفسه."],accExamFocus:"الكوتش لا يعطي واجبات منزلية للعميل أبداً! العميل هو من يصوغ أفعاله وخطواته وطريقة محاسبته لنفسه."}],Zg=[{id:1,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"توضيح طبيعة وقيمة الكوتشينج وسريته",standardTextAr:"يشرح ويوضح للعميل والراعي طبيعة الكوتشينج، وحدود السرية، والترتيبات المالية، وأي شروط أخرى لعقد الكوتشينج قبل بدء الجلسات.",standardTextEn:"Explains and ensures that, prior to or at the initial meeting, the coaching client(s) and sponsor(s) understand the nature and potential value of coaching, the nature and limits of confidentiality, financial arrangements, and any other terms of the coaching agreement.",practicalContext:"عقد جلسة تعريفية (Chemistry / Discovery Call) وتوقيع عقد واضح ومفصل يحدد أن الكوتشينج ليس علاجاً أو استشارة.",commonPitfall:"البدء المباشر في التدريب دون توضيح خطوط السرية وإمكانية الإفصاح في الحالات القانونية الصريحة."},{id:2,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"الاتفاقية والعقد الشامل مع العميل والراعي",standardTextAr:"يصيغ اتفاقية/عقد كوتشينج يحدد الأدوار والمسؤوليات وحقوق جميع الأطراف ذات الصلة قبل بدء تقديم الخدمات.",standardTextEn:"Creates an agreement/contract regarding the roles, responsibilities, and rights of all parties involved with their client(s) and sponsor(s) prior to the beginning of services.",practicalContext:'التفريق بين دور "العميل" الذي يتلقى الجلسات ودور "الراعي" الذي يدفع الفاتورة، وتحديد آلية مشاركة تقارير التقدم العامة دون كشف تفاصيل الجلسات.',commonPitfall:"السماح للراعي بطلب تقارير تفصيلية عن مشاعر أو أسرار العميل دون موافقة خطية صريحة مسبقة."},{id:3,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"حماية السرية التامة والاستثناءات القانونية",standardTextAr:"يحافظ على أقصى درجات السرية مع جميع الأطراف المعنية وفق ما هو متفق عليه، ما لم يقتض القانون خلاف ذلك (مثل خطر إيذاء النفس أو الآخرين).",standardTextEn:"Maintains the strictest levels of confidentiality with all parties as agreed upon, except where release is required by law.",practicalContext:"حفظ الملاحظات في أماكن مشفرة ومحمية، وعدم مناقشة أي عميل بالاسم في جلسات التوجيه أو الإشراف إلا دون معلومات تدل على هويته.",commonPitfall:"التساهل بنشر تجارب الجلسات على وسائل التواصل الاجتماعي حتى دون ذكر الاسم إذا كانت تفاصيل القصة فريدة وتفضح هوية العميل."},{id:4,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"وضوح تبادل المعلومات بين العميل والراعي",standardTextAr:"يمتلك تفاهماً واضحاً حول كيفية تبادل المعلومات بين الكوتش والعميل والراعي.",standardTextEn:"Has a clear understanding about how information exchanges among the coach, client, and sponsor.",practicalContext:"الاتفاق المسبق على أن الراعي يتلقى فقط تأكيد الحضور والمواضيع العامة بإشراف وموافقة العميل.",commonPitfall:"الرد على أسئلة هاتفية عفوية من المدير المباشر حول ما قاله الموظف في الجلسة."},{id:5,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"إدارة الأدوار وتضارب المصالح التعاقدية",standardTextAr:"يمتلك تفاهماً واضحاً مع العميل والراعي حول الظروف التي قد يحدث فيها تضارب في الشروط أو المصالح، بما في ذلك الأدوار المتعددة.",standardTextEn:"Understands and manages with clarity conditions where multiple roles might exist or conflict.",practicalContext:"عندما يكون الكوتش داخلياً (Internal Coach) في الشركة وله أيضاً دور إداري أو في الموارد البشرية.",commonPitfall:"الخلط بين دور التقييم الوظيفي ودور الكوتشينج المحايد الداعم لنفس الموظف."},{id:6,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"حق إنهاء العلاقة للكوتش والعميل",standardTextAr:"يحترم حق جميع الأطراف في إنهاء علاقة الكوتشينج في أي وقت ولأي سبب، وفقاً لما تنص عليه الاتفاقية.",standardTextEn:"Respects the client’s right to terminate the coaching relationship at any point during the process, subject to the provisions of the agreement.",practicalContext:"إذا شعر العميل أنه لم يعد يستفيد، يرحب الكوتش بالقرار بشفافية دون ممارسة أي ضغوط أو إشعار بالذنب.",commonPitfall:"إجبار العميل على استكمال الجلسات بحجة وجود أهداف لم تكتمل بعد."},{id:7,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"الإحالة الأخلاقية إلى متخصصين آخرين",standardTextAr:"يقترح على العميل الاستعانة بخدمات متخصصين آخرين (كالمعالجين النفسيين أو المستشارين) عندما يتبين أن احتياجاته تقع خارج نطاق الكوتشينج أو أنه لن يستفيد منه بشكل كافٍ.",standardTextEn:"Suggests the client seek other support professionals when it appears the client would be better served by another resource.",practicalContext:"ملاحظة علامات الاكتئاب السريري أو اضطرابات ما بعد الصدمة أو الحاجة لاستشارة قانونية/مالية بحتة.",commonPitfall:"محاولة الكوتش أداء دور المعالج النفسي من باب التعاطف أو الحرص الزائد."},{id:8,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"حظر أي استغلال عاطفي أو مالي أو جسدي",standardTextAr:"لا يستغل العميل أو الراعي بأي شكل من الأشكال المالية أو الجنسية أو العاطفية أو غيرها.",standardTextEn:"Does not exploit the client or sponsor in any manner, financially, sexually, or emotionally.",practicalContext:"عدم استغلال معلومات الشركة الاستثمارية الخاصة بالعميل لتحقيق مكاسب شخصية في الأسهم أو التجارة.",commonPitfall:"طلب استثمارات أو خدمات تجارية مجانية من العميل أثناء فترة الكوتشينج مستغلاً ثقته."},{id:9,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"حظر العلاقات الرومانسية والجنسية",standardTextAr:"يتجنب أي علاقة رومانسية أو جنسية مع العملاء أو الرعاة الحاليين، ويتخذ الإجراء المناسب لمعالجة المسألة أو إنهاء الخدمة فوراً إذا طرأت.",standardTextEn:"Avoids any romantic or sexual relationship with clients or sponsors.",practicalContext:"وضع حدود شخصية ومهنية صارمة، والانسحاب الفوري من علاقة الكوتشينج إذا نشأت مشاعر رومانسية تؤثر على الحياد.",commonPitfall:"الاستمرار في تقديم الجلسات عند وجود انجذاب شخصي أو تلميحات رومانسية دون توقف فوري."},{id:10,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"الصدق وعدم تقديم وعود أو ادعاءات مضللة",standardTextAr:"لا يقدم ادعاءات مضللة أو غير واقعية حول ما سيناله العميل من نتائج من عملية الكوتشينج.",standardTextEn:"Does not make misleading claims regarding coaching outcomes.",practicalContext:'عدم تقديم ضمانات مثل: "أضمن لك الحصول على ترقية تنفيذية أو مضاعفة أرباحك بنسبة 300% في شهرين".',commonPitfall:"استخدام إعلانات تسويقية مبالغ فيها تعِد بحل المشاكل الحياتية والمالية بين عشية وضحاها."},{id:11,section:1,sectionTitleAr:"القسم الأول: المسؤولية تجاه العملاء",sectionTitleEn:"Section I: Responsibility to Clients",titleAr:"عدم تقديم نصائح خارج نطاق الكفاءة والخبرة",standardTextAr:"لا يزود العملاء أو الرعاة بمعلومات أو نصائح مضللة أو تقع خارج نطاق كفاءته المعتمدة.",standardTextEn:"Does not give coaching clients or sponsors misleading advice outside competence.",practicalContext:"الامتناع عن تقديم استشارات ضريبية أو طبية أو قانونية، والتأكيد على ضرورة مراجعة أهل الاختصاص.",commonPitfall:"إبداء رأي قاطع في نزاع قضائي يخص العميل أثناء الجلسة."},{id:12,section:2,sectionTitleAr:"القسم الثاني: المسؤولية تجاه الممارسة والأداء",sectionTitleEn:"Section II: Responsibility to Practice and Performance",titleAr:"التزام فريق العمل والمساعدين بمدونة الأخلاقيات",standardTextAr:"يضمن التزام جميع العاملين معه ومساعديه والمتدربين بمدونة أخلاقيات ICF في كل تعاملاتهم.",standardTextEn:"Ensures that all support personnel and associates adhere to the ICF Code of Ethics.",practicalContext:"تدريب المساعد الإداري أو السكرتير على سياسة السرية وحماية بيانات وجداول العملاء بأمان.",commonPitfall:"ترك المساعدين يطلعون على ملفات الجلسات والملاحظات دون توقيع اتفاقيات سرية صارمة."},{id:13,section:2,sectionTitleAr:"القسم الثاني: المسؤولية تجاه الممارسة والأداء",sectionTitleEn:"Section II: Responsibility to Practice and Performance",titleAr:"التطوير المهني المستمر والممارسة التأملية",standardTextAr:"يلتزم بالتطوير المهني المستمر والممارسة التأملية لتحسين كفاءته الشخصية ومهاراته في الكوتشينج.",standardTextEn:"Commits to continuous professional development and reflective practice.",practicalContext:"حضور برامج التعليم المستمر (CCE)، وتلقي جلسات Mentor Coaching وإشراف بانتظام.",commonPitfall:"الاكتفاء بالحصول على أول شهادة واعتماد دون تجديد المعرفة أو مراجعة الأداء."},{id:14,section:2,sectionTitleAr:"القسم الثاني: المسؤولية تجاه الممارسة والأداء",sectionTitleEn:"Section II: Responsibility to Practice and Performance",titleAr:"الاعتراف بالمشكلات الشخصية وتعليق العمل عند الحاجة",standardTextAr:"يدرك القيود الشخصية أو الظروف النفسية/الصحية التي قد تتعارض مع أدائه المهني ويسعى للمساعدة أو تعليق العمل مؤقتاً.",standardTextEn:"Recognizes personal limitations or circumstances that may conflict with professional performance and suspends work if needed.",practicalContext:"في حالة المرور بحالة حداد شديدة أو أزمة صحية تمنع الحضور الكامل والحياد، يعلق الكوتش جلساته بأمانة.",commonPitfall:"الإصرار على تقديم الجلسات أثناء الانهيار النفسي للكوتش مما ينعكس سلباً على المستفيد."},{id:15,section:2,sectionTitleAr:"القسم الثاني: المسؤولية تجاه الممارسة والأداء",sectionTitleEn:"Section II: Responsibility to Practice and Performance",titleAr:"حل النزاعات وتضارب المصالح مع الأطراف",standardTextAr:"يسعى لحل أي تضارب في المصالح أو نزاع يطرأ مع العميل أو الراعي بمهنية وبالتنسيق مع الجهات المعنية.",standardTextEn:"Resolves any conflict of interest with clients or sponsors appropriately.",practicalContext:"إذا استجدت شراكة استثمارية أو خصومة بين الكوتش والشركة الراعية، يتم الإفصاح الفوري وإعادة تقييم العلاقة.",commonPitfall:"إخفاء تعارض المصالح أملاً في استمرار تلقي أتعاب الجلسات."},{id:16,section:2,sectionTitleAr:"القسم الثاني: المسؤولية تجاه الممارسة والأداء",sectionTitleEn:"Section II: Responsibility to Practice and Performance",titleAr:"التوثيق الدقيق وحفظ السجلات بأمان",standardTextAr:"ينشئ ويحتفظ بسجلات دقيقة حول جلسات الكوتشينج مع مراعاة أعلى معايير الخصوصية والأمان وقوانين حماية البيانات.",standardTextEn:"Creates, maintains, stores, and disposes of any records in a manner that promotes confidentiality and privacy.",practicalContext:"استخدام برامج مشفرة، وتأمين الأجهزة بكلمات سر قوية، وإتلاف السجلات القديمة بطريقة آمنة.",commonPitfall:"حفظ أسماء العملاء وملاحظات الجلسات في تطبيقات مجانية مفتوحة أو أوراق مبعثرة على المكتب."},{id:17,section:2,sectionTitleAr:"القسم الثاني: المسؤولية تجاه الممارسة والأداء",sectionTitleEn:"Section II: Responsibility to Practice and Performance",titleAr:"توضيح شروط الدفع والتعويضات مسبقاً",standardTextAr:"يتفق مع العميل والراعي على شروط الدفع والتعويضات المالية بوضوح وشفافية كاملة قبل بدء العمل.",standardTextEn:"Agrees upon payment terms and compensation with client and sponsor in advance.",practicalContext:"تضمين سياسة الإلغاء، والتأخير، وجداول الدفعات في العقد الموقع بين الطرفين.",commonPitfall:"مطالبة العميل برسوم مفاجئة غير منصوص عليها في العقد الأصلي."},{id:18,section:3,sectionTitleAr:"القسم الثالث: المسؤولية تجاه الاحترافية",sectionTitleEn:"Section III: Responsibility to Professionalism",titleAr:"التعريف الصادق بالمؤهلات والشهادات والاعتمادات",standardTextAr:"يعرّف بدقة مؤهلاته وخبراته ودرجات اعتماده من ICF، ولا يقدم أي ادعاء كاذب أو مضلل بهذا الشأن.",standardTextEn:"Accurately identifies coaching qualifications, credentials, and ICF status.",practicalContext:'إذا كان حاصلاً على تدريب ACC فقط ولم يجتز الاختبار بعد، يذكر أنه "متدرب" ولا يدعي أنه "كوتش معتمد ACC".',commonPitfall:"استخدام شعار ICF أو لقب كوتش معتمد قبل صدور الاعتماد الرسمي من الاتحاد."},{id:19,section:3,sectionTitleAr:"القسم الثالث: المسؤولية تجاه الاحترافية",sectionTitleEn:"Section III: Responsibility to Professionalism",titleAr:"احترام حقوق الملكية الفكرية ونسب المواد لأصحابها",standardTextAr:"يحترم حقوق الملكية الفكرية ويعترف بإسهامات الآخرين وينسب المواد والمصنفات والنماذج لأصحابها الأصليين.",standardTextEn:"Respects intellectual property and acknowledges contributions of others.",practicalContext:"عند استخدام نموذج GROW أو أدوات تقييم معينة، يتم ذكر اسم مبتكرها الأصلي بوضوح في العروض والنماذج.",commonPitfall:"أخذ مواد تدريبية من كوتش آخر ووضع اسمك عليها وبيعها للجمهور دون إذن."},{id:20,section:3,sectionTitleAr:"القسم الثالث: المسؤولية تجاه الاحترافية",sectionTitleEn:"Section III: Responsibility to Professionalism",titleAr:"حماية بيانات أعضاء وشبكة ICF",standardTextAr:"يستخدم معلومات الاتصال الخاصة بأعضاء ICF فقط بالحدود المصرح بها ولا يستخدمها لأغراض ترويجية أو إرسال رسائل غير مرغوبة.",standardTextEn:"Uses ICF member contact information only as authorized.",practicalContext:"عدم سحب إيميلات دليل الكوتشيز المعتمدين في ICF وإرسال حملات تسويقية عشوائية لهم.",commonPitfall:"استغلال قوائم مجتمع ICF لبيع كورسات خاصة دون ترخيص."},{id:21,section:3,sectionTitleAr:"القسم الثالث: المسؤولية تجاه الاحترافية",sectionTitleEn:"Section III: Responsibility to Professionalism",titleAr:"تجنب تضارب المصالح وإدارته بالشفافية والانسحاب",standardTextAr:"يتجنب أي تضارب مصالح فعلي أو محتمل، ويفصح عنه فوراً ويتنحى من العلاقة إذا تعذر حله بحيادية.",standardTextEn:"Avoids and immediately discloses conflicts of interest and withdraws if unresolvable.",practicalContext:"تقديم كوتشينج لمرشحين متنافسين على نفس المنصب التنفيذي في شركة واحدة يمثل تضارب مصالح خطير يتطلب الشفافية أو التنحي.",commonPitfall:"الاستمرار في كوتشينج منافسين شرسين في نفس السوق بنفس الوقت مع الاطلاع على أسرارهما الاستراتيجية."},{id:22,section:3,sectionTitleAr:"القسم الثالث: المسؤولية تجاه الاحترافية",sectionTitleEn:"Section III: Responsibility to Professionalism",titleAr:"سرية ونزاهة أدوات التقييم والاختبارات",standardTextAr:"يحافظ على نزاهة وسرية نتائج التقييمات والأدوات المستخدمة في الكوتشينج ويستخدمها فقط لصالح العميل.",standardTextEn:"Maintains the integrity and confidentiality of assessments and tools.",practicalContext:"عدم مشاركة نتائج مقاييس الشخصية (مثل DISC أو 360) مع مديري الشركة دون موافقة كتابية صريحة من العميل.",commonPitfall:"استخدام نتائج تقييم الكوتشينج في جلسات التقييم السنوي لفصل الموظف أو ترقيته دون اتفاق مسبق."},{id:23,section:3,sectionTitleAr:"القسم الثالث: المسؤولية تجاه الاحترافية",sectionTitleEn:"Section III: Responsibility to Professionalism",titleAr:"صون سمعة مهنة الكوتشينج وعدم الإساءة لها",standardTextAr:"يتصرف بطريقة تعزز سمعة مهنة الكوتشينج وسمعة الـ ICF ويتجنب أي سلوك قد يسيء لثقة الجمهور بالمهنة.",standardTextEn:"Conducts themselves in a manner that brings credit to the coaching profession and ICF.",practicalContext:"التحلي بالأدب والاحترام في المناقشات العامة والمهنية، والابتعاد عن التشهير بالزملاء أو التهجم.",commonPitfall:"نشر منشورات عدائية تهاجم مدارس الكوتشينج الأخرى أو تسخر من العملاء على وسائل التواصل."},{id:24,section:4,sectionTitleAr:"القسم الرابع: المسؤولية تجاه المجتمع",sectionTitleEn:"Section IV: Responsibility to Society",titleAr:"مناهضة التمييز والالتزام بالعدالة والإنصاف",standardTextAr:"يتجنب التمييز بجميع أشكاله على أساس العرق أو الجنس أو الدين أو الجنسية أو الإعاقة، ويعامل الجميع بعدالة واحترام.",standardTextEn:"Avoids discrimination in all forms and fosters equity, diversity, and inclusion.",practicalContext:"خلق مساحة مرحبة بجميع الخلفيات الثقافية وتقدير التنوع البشري في جلسات الكوتشينج.",commonPitfall:"رفض تقديم الخدمة لعميل بسبب معتقداته الشخصية أو خلفيته العرقية دون مسوغ موضوعي مشروع."},{id:25,section:4,sectionTitleAr:"القسم الرابع: المسؤولية تجاه المجتمع",sectionTitleEn:"Section IV: Responsibility to Society",titleAr:"المساهمة الإيجابية في المجتمع وخدمة الصالح العام",standardTextAr:"يسعى لتقديم مساهمات إيجابية للمجتمع واستخدام الكوتشينج كأداة لتمكين الأفراد والمجتمعات ونشر الخير.",standardTextEn:"Contributes positively to society through professional coaching.",practicalContext:"المشاركة في مبادئ الكوتشينج التطوعي (Pro Bono) للمنظمات غير الربحية والقادة الشباب.",commonPitfall:"النظر لمهنة الكوتشينج كأداة جباية مالية بحتة دون أي مسؤولية مجتمعية."},{id:26,section:4,sectionTitleAr:"القسم الرابع: المسؤولية تجاه المجتمع",sectionTitleEn:"Section IV: Responsibility to Society",titleAr:"الشفافية في التسويق والإعلانات والبحوث",standardTextAr:"يلتزم بالصدق والشفافية في جميع الأنشطة التسويقية والإعلامية والبحوث العلمية المتعلقة بالكوتشينج.",standardTextEn:"Maintains honesty and transparency in marketing, research, and publications.",practicalContext:"نشر أرقام وإحصائيات دقيقة وموثقة دون تزييف معدلات النجاح أو نتائج التدخلات.",commonPitfall:"تأليف تقييمات عملاء وهمية (Fake Testimonials) على الموقع الإلكتروني."},{id:27,section:4,sectionTitleAr:"القسم الرابع: المسؤولية تجاه المجتمع",sectionTitleEn:"Section IV: Responsibility to Society",titleAr:"الإبلاغ عن الانتهاكات الأخلاقية الجسيمة",standardTextAr:"يتحمل المسؤولية عن معالجة أو الإبلاغ عن أي انتهاك خطير لمدونة الأخلاقيات وفق الإجراءات المعتمدة لدى ICF.",standardTextEn:"Recognizes personal responsibility to report or address serious ethical breaches through ICF procedures.",practicalContext:"في حال علم الكوتش بانتهاك خطير يمس أمان العملاء أو نزاهة المهنة، يسعى للتوجيه أو التبليغ لمجلس مراجعة الأخلاقيات (IRB).",commonPitfall:"التستر على انتهاكات صريحة للسلامة أو الاحتيال المالي بداعي الزمالة."},{id:28,section:4,sectionTitleAr:"القسم الرابع: المسؤولية تجاه المجتمع",sectionTitleEn:"Section IV: Responsibility to Society",titleAr:"عدم التواطؤ أو التستر في انتهاكات الآخرين",standardTextAr:"لا يشارك أو يتواطأ بأي شكل في ممارسات تنتهك مدونة أخلاقيات ICF ولا يدعم ممارسات غير أخلاقية.",standardTextEn:"Does not collude or participate in practices violating the ICF Code of Ethics.",practicalContext:"رفض توقيع عقود تدريب وهمية أو شهادات تدريب كوتشينج غير مستحقة لزملاء للحصول على اعتمادات.",commonPitfall:"توقيع ساعات كوتشينج كاذبة لزميل لتسهيل تقدمه لاعتماد ACC دون تقديم الجلسات فعلياً."}],_h=[{letter:"G",phaseAr:"الهدف (Goal)",phaseEn:"Goal",definition:"تحديد ما يريد العميل تحقيقه في الجلسة وعلى المدى الطويل بشكل واضح، محدد، وملموس.",coachRole:"يساعد العميل على صياغة هدف إيجابي وواقعي وملهم يمتلكه هو بالكامل، ويوضح معايير قياس تحققه بنهاية الجلسة.",sampleQuestions:["ما الذي ترغب في تحقيقه اليوم في نهاية جلستنا معاً؟","كيف سيبدو النجاح بالنسبة لك؟ وكيف ستعرف أنك وصلت إليه؟","ما الأثر الإيجابي الذي سيحققه هذا الهدف في حياتك أو عملك؟","ما الجزء المحدد من هذا التحدي الذي تود التركيز عليه الآن؟"],practicalTips:"تأكد من أن الهدف ينبع من إرادة العميل وليس رغبة رئيسه أو أسرته، وأن الوقت المتاح في الجلسة يتناسب واقعياً مع عمق الهدف."},{letter:"R",phaseAr:"الواقع الحالي (Reality)",phaseEn:"Reality",definition:"استكشاف الوضع الراهن كما هو بموضوعية وتجرد، وتحديد التحديات، المشاعر، والسياق الحالي.",coachRole:"يستمع بعمق دون إصدار أحكام، ويثير الوعي بالافتراضات والأنماط المعطلة دون إغراق الجلسة في سرد التفاصيل التاريخية.",sampleQuestions:["أين تقف الآن بالتحديد بالنسبة لهذا الهدف؟","ما الذي جربته حتى الآن وما النتيجة التي حصلت عليها؟","ما هي العقبات الحقيقية التي تشعر أنها تقف في طريقك؟","ما الذي تخشاه أو يجعلك تتردد في المضي قدماً؟"],practicalTips:"لا تدع العميل يشتكي أو يقدم أعذاراً مطولة؛ وجّه الحديث بلباقة نحو وعيه الذاتي ومسؤوليته في اللحظة الراهنة."},{letter:"O",phaseAr:"الخيارات والبدائل (Options)",phaseEn:"Options",definition:"العصف الذهني وتوليد خيارات وبدائل متعددة وغير مسبوقة للوصول إلى الهدف المنشود.",coachRole:'يشجع التفكير خارج الصندوق، ويزيل القيود الذهنية ("ماذا لو كان كل شيء ممكناً؟")، ويمتنع عن تقديم حلوله واقتراحاته الخاصة.',sampleQuestions:["ما الخيارات المتاحة أمامك الآن للتصرف؟","إذا اختفت كل المخاوف والعوائق، فما الذي ستفعله فوراً؟","ماذا سيفعل شخص تثق في حكمته وشجاعته لو كان في مكانك؟","ما هو الخيار الأكثر جرأة الذي خطر ببالك للتو؟"],practicalTips:"ادفع العميل للوصول إلى 4 أو 5 خيارات على الأقل قبل الانتقال للتقييم، ولا تنتقد أي فكرة في مرحلة التوليد."},{letter:"W",phaseAr:"الإرادة وخطوات التنفيذ (Will / Way Forward)",phaseEn:"Will / Way Forward",definition:"تحويل الخيارات إلى التزام حقيقي وخطة عمل ملموسة بنقاط ومواعيد ومساءلة ذاتية واضحة.",coachRole:"يدعم العميل في تحديد ما سيفعله، متى سيبدأ، ومستوى التزامه من 1 إلى 10، وكيف سيتعامل مع العقبات المحتملة.",sampleQuestions:["من بين كل الخيارات التي ناقشناها، ما الخيار الذي ستلتزم بتنفيذه؟","ما هي أول خطوة عملية ومحددة ستقوم بها؟ ومتى تحديداً؟","على مقياس من 1 إلى 10، ما مدى التزامك بتنفيذ هذه الخطوة؟ (وإذا كان أقل من 8: ما الذي يجعله 9 أو 10؟)","ما العقبة المحتملة التي قد تواجهك، وكيف ستتغلب عليها؟ وكيف ستحتفل بنجاحك؟"],practicalTips:"تأكد من أن الكوتش لا يمارس دور المراقب أو المعلم؛ بل دع العميل يختار شريك الدعم أو طريقة توثيق إنجازه بنفسه."}],Jl={titleAr:"دليل ورؤى اعتبارات الأخلاقيات (ICE) وإحالة المستفيدين",overviewAr:"يعتبر الـ ICF أن من أسمى معايير الأخلاق المهنية إدراك الكوتش لحدود كفاءته ومعرفة متى لم يعد الكوتشينج يخدم مصلحة العميل القصوى، والمبادرة بالإحالة لمتخصصين آخرين (أطباء، معالجون نفسيون، مستشارون، محامون).",distinctions:[{modality:"الكوتشينج (Coaching)",focus:"الحاضر نحو المستقبل، تنمية الإمكانات، العمل والشراكة الذاتية، لا تشخيص ولا إرشاد.",whoLeads:"العميل هو الخبير ويقود الأجندة."},{modality:"العلاج النفسي (Therapy / Psychotherapy)",focus:"معالجة جراح وصدمات الماضي، علاج الاضطرابات النفسية والسلوكية، التشخيص الإكلينيكي وتسكين الألم.",whoLeads:"المعالج هو الخبير الإكلينيكي ويضع خطة العلاج."},{modality:"الاستشارات (Consulting)",focus:"تحليل المشكلات المؤسسية أو الفنية، وتقديم التوصيات والحلول الجاهزة وخارطة الطريق من واقع الخبرة.",whoLeads:"المستشار هو الخبير في المجال ويقدم الإجابات."},{modality:"التوجيه (Mentoring)",focus:"نقل الخبرات والتجارب والحكمة التراكمية من شخص أقدم في نفس المسار المهني أو التخصص.",whoLeads:"الموجه يشارك قصصه وتجاربه الإرشادية مع المستفيد."}],redFlagsForReferral:["أفكار متكررة حول إيذاء النفس، الانتحار، أو إيذاء الآخرين (إحالة طارئة فورية).","أعراض اكتئاب سريري حاد، قلق معطل يعيق الوظائف اليومية، نوبات هلع مستمرة، أو اضطراب نوم حاد متواصل.","صدمة نفسية غير معالجة (PTSD) تسبب نوبات استرجاع (Flashbacks) تمنع التركيز في الجلسة.","إدمان نشط على الكحول أو المخدرات يعطل الوعي والإدراك السليم.","عدم القدرة على التطلع للمستقبل أو اتخاذ القرارات، والتعلق المستمر بالحاجة إلى كشف صدمات الطفولة أو طلب مسكنات نفسية."],referralProtocol:["1. التحضير والملاحظة: رصد المؤشرات بوضوح ودون إصدار أحكام إكلينيكية (أنت لست طبيباً).","2. المحادثة الشفافة: التحدث مع العميل بصدق ودفء، ومشاركة الملاحظات بموضوعية، مع التعبير عن الرعاية العميقة لمصلحته.","3. توضيح حدود الكوتشينج: التأكيد على أن الكوتشينج يركز على التطوير والعمل المستقبلي، وأن احتياجاته الحالية ستخدم بأفضل صورة على يد متخصص معتمد.","4. إتاحة الخيارات بحياد: تقديم قائمة أو توجيهه للبحث عن أطباء/معالجين نفسيين مرخصين دون فرض طبيب بعينه.","5. القرار التعاقدي: تحديد ما إذا كان الكوتشينج سيتوقف تماماً، أو سيعلق مؤقتاً، أو سيستمر بالتوازي بشرط موافقة الطبيب المعالج والعميل الصريحة."]},qt=[{id:1,competencyId:1,standardId:7,topic:"إحالة العميل للصحة النفسية",category:"الإحالة ومتخصصين",difficulty:"متوسط",scenario:'أثناء جلسة الكوتشينج الرابعة، انهار العميل في البكاء وصرح بأنه يشعر بحزن مطبق وعجز عن مغادرة الفراش منذ أكثر من شهر، وتراوده أفكار متكررة بأنه "لو اختفى من هذا العالم لكان أفضل للجميع". كيف يتصرف كوتش الـ ACC المحترف وفقاً لأخلاقيات ICF؟',options:[{letter:"أ",text:"يشارك العميل مشاعر التعاطف ويسأله عن أهداف الأسبوع القادم في نموذج GROW ليشغله عن الأفكار السلبية ويدفعه للعمل الإيجابي.",isCorrect:!1,feedback:"غير صحيح على الإطلاق. هذه علامة تحذيرية حمراء (Red Flag) تتضمن أفكاراً محتملة لإيذاء النفس أو اكتئاباً حاداً. محاولة تطبيق GROW أو تجاهل الخطر يعد إهمالاً مهنياً خطيراً ينتهك المعيار 7."},{letter:"ب",text:"يعترف الكوتش بمشاعره العميقة برعاية واهتمام، ويوضح له أن هذه المشاعر تتطلب دعماً طبياً ونفسياً متخصصاً، ويقترح عليه الإحالة الفورية لطبيب أو معالج نفسي مرخص مع تعليق جلسات الكوتشينج.",isCorrect:!0,feedback:"إجابة صحيحة ومثالية! تتماشى تماماً مع المعيار الأخلاقي رقم 7 ودليل اعتبارات الأخلاقيات (ICE). عندما تظهر مؤشرات إيذاء النفس أو اضطراب سريري، يجب على الكوتش إظهار الدعم والإحالة فوراً دون محاولة التشخيص أو الاستمرار في الكوتشينج."},{letter:"ج",text:"يقوم الكوتش بإجراء جلسة استرخاء وتأمل عميق لمساعدته على التخلص من الصدمة، ثم يصف له بعض المكملات العشبية لتحسين مزاجه ونومه.",isCorrect:!1,feedback:"مخالفة أخلاقية جسيمة (المعيار 11 و1). الكوتش ليس معالجاً ولا طبيباً ولا يحق له تقديم تدخلات علاجية أو وصف علاجات ومكملات."},{letter:"د",text:"يطلب من العميل أخذ استراحة شاي لمدة 10 دقائق ثم يكمل الجلسة في مناقشة أهدافه المهنية حتى لا يضيع وقت الجلسة المدفوع.",isCorrect:!1,feedback:"سلوك يفتقر للإنسانية والأمان النفسي، وينكر معاناة العميل وخطورة الأفكار الانتحارية أو الاكتئابية."}],reference:"مدونة الأخلاقيات: المعيار 7 (الإحالة لمتخصصين) والجدارة 1 (الممارسة الأخلاقية).",referenceDetail:"تنص أخلاقيات ICF على أن الكوتش يقترح فوراً الاستعانة بمتخصصين آخرين عندما يتبين أن احتياجات العميل تتجاوز نطاق الكوتشينج أو تشكل خطراً على سلامته.",keyTakeaway:"أفكار إيذاء النفس والاكتئاب الحاد خطوط حمراء توجب الإحالة الفورية دون استمرار في الكوتشينج."},{id:2,competencyId:1,standardId:3,topic:"السرية وضغط الراعي (Sponsor)",category:"الأخلاقيات",difficulty:"صعب",scenario:"تتلقى اتصالاً عاجلاً من مدير الموارد البشرية (الراعي الذي يدفع تكلفة عقد الكوتشينج لأحد الموظفين)، ويطلب منك تزويده بتفاصيل ما قاله الموظف عن مديره المباشر وعن نيته في الاستقالة، مبرراً ذلك بأن الشركة هي التي تمول الجلسات ومن حقها نظاماً معرفة العائد على الاستثمار قبل اتخاذ قرارات الترقية. ما هو التصرف المعتمد من ICF؟",options:[{letter:"أ",text:"تزويده بملخص عام جداً لما قاله الموظف مع حذف اسمه احتراماً لكون الشركة هي صاحبة التمويل.",isCorrect:!1,feedback:"غير صحيح. مجرد مشاركة تفاصيل ما دار في الجلسة حتى لو كانت ملخصة يعد خرقاً صريحاً لسرية العميل المنصوص عليها في المعيارين 3 و4."},{letter:"ب",text:"تذكير مدير الموارد البشرية بلباقة باتفاقية الكوتشينج الموقعة وبنود السرية المعتمدة من ICF، وتوضيح أن تفاصيل ما يطرحه الموظف سرية تماماً، مع إمكانية مشاركة تقارير الحضور أو تقدم الأهداف بموافقة العميل المسبقة فقط.",isCorrect:!0,feedback:"إجابة صحيحة 100%! المعيار 3 والمعيار 4 يفرضان حماية تامة لسرية الجلسات حتى أمام الراعي الممول، مع الالتزام
